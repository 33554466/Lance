<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  /* This screen is on continuously in a room people live in. Dark by
     default, no pure white anywhere, nothing that pulses when idle. */
  :root {
    --bg:      #0e1116;
    --panel:   #161b22;
    --text:    #e6edf3;
    --dim:     #7d8590;
    --accent:  #4493f8;
    --live:    #3fb950;
    --think:   #d29922;
    --speak:   #a371f7;
    --error:   #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ambient (idle) ---------- */
  #ambient {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.5rem;
  }
  #clock  { font-size: 12rem; font-weight: 200; letter-spacing: -0.04em;
            line-height: 1; font-variant-numeric: tabular-nums; }
  #date   { font-size: 2rem; color: var(--dim); font-weight: 300; }
  #greeting { margin-top: 2.5rem; font-size: 1.5rem; color: var(--dim); }

  /* ---------- conversation ---------- */
  #convo {
    flex: 1; display: none; flex-direction: column;
    padding: 4rem 6rem; gap: 2rem; overflow: hidden;
  }
  #heard {
    font-size: 2.2rem; color: var(--dim); font-weight: 300;
    line-height: 1.35; flex-shrink: 0;
  }
  #heard::before { content: "❝ "; opacity: 0.4; }
  #reply {
    font-size: 3rem; line-height: 1.4; font-weight: 300;
    overflow-y: auto; flex: 1;
  }
  #reply::-webkit-scrollbar { width: 0; }

  /* ---------- status bar ---------- */
  #bar {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.25rem 2rem; background: var(--panel);
    border-top: 1px solid #21262d; flex-shrink: 0;
  }
  #dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--dim); flex-shrink: 0;
    transition: background 0.25s ease;
  }
  #status { font-size: 1.3rem; letter-spacing: 0.02em; }
  #meta { margin-left: auto; font-size: 1rem; color: var(--dim);
          font-variant-numeric: tabular-nums; }

  /* Only animate when the device is actually doing something — an idle
     screen that pulses all night is a screen people cover with a towel. */
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  .state-idle         #dot { background: var(--dim); }
  .state-listening    #dot { background: var(--live); }
  .state-transcribing #dot { background: var(--live); }
  .state-thinking     #dot { background: var(--think); }
  .state-speaking     #dot { background: var(--speak); }
  .state-error        #dot { background: var(--error); }
  .state-offline      #dot { background: var(--error); }

  /* ---------- typed fallback ---------- */
  #typed {
    position: fixed; left: 50%; bottom: 7rem; transform: translateX(-50%);
    width: min(70ch, 80vw); padding: 1rem 1.25rem; font-size: 1.4rem;
    background: var(--panel); color: var(--text);
    border: 1px solid #30363d; border-radius: 10px;
    display: none; outline: none;
  }
  #typed:focus { border-color: var(--accent); }

  /* Kiosk cursor policy: visible while the mouse is moving, gone after a
     few seconds of stillness. Always-hidden looks right on the finished
     appliance and is maddening while you are testing in a browser tab. */
  body.hide-cursor, body.hide-cursor * { cursor: none; }
</style>
</head>
<body class="state-idle">

  <div id="ambient">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="greeting"></div>
  </div>

  <div id="convo">
    <div id="heard"></div>
    <div id="reply"></div>
  </div>

  <input id="typed" placeholder="Type a question, Enter to send, Esc to dismiss"
         autocomplete="off" spellcheck="false">

  <div id="bar">
    <div id="dot"></div>
    <div id="status">Starting…</div>
    <div id="meta"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  let name = "Assistant", idleTimer = null, ws = null, backoff = 500;

  const LABELS = {
    idle:         "Ready",
    listening:    "Listening…",
    transcribing: "Got it…",
    thinking:     "Thinking…",
    speaking:     "Speaking",
    error:        "Something went wrong",
    offline:      "Orchestrator offline",
  };

  // ---------- clock ----------
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], {
      hour: "numeric", minute: "2-digit"
    });
    $("date").textContent = d.toLocaleDateString([], {
      weekday: "long", month: "long", day: "numeric"
    });
  }
  tick();
  setInterval(tick, 1000);

  // ---------- views ----------
  function showAmbient() {
    $("ambient").style.display = "flex";
    $("convo").style.display = "none";
  }
  function showConvo() {
    clearTimeout(idleTimer);
    $("ambient").style.display = "none";
    $("convo").style.display = "flex";
  }
  function scheduleIdle(ms = 45000) {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showAmbient, ms);
  }

  function setState(state, detail) {
    // Preserve the cursor class — className assignment would wipe it, and
    // the cursor would flicker back on every state change.
    const cursorHidden = body.classList.contains("hide-cursor");
    body.className = "state-" + state;
    if (cursorHidden) body.classList.add("hide-cursor");
    $("status").textContent = LABELS[state] || state;
    $("status").classList.toggle(
      "pulse", ["listening", "transcribing", "thinking"].includes(state)
    );
    $("meta").textContent = detail ? detail + " tier" : "";
    if (state === "idle") scheduleIdle();
  }

  // ---------- socket ----------
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws/display`);

    ws.onopen = () => { backoff = 500; };

    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      switch (m.type) {
        case "hello":
          name = m.name;
          $("greeting").textContent = `Say “${name}” to begin`;
          break;
        case "state":
          setState(m.state, m.detail);
          break;
        case "transcript":
          showConvo();
          $("heard").textContent = m.text;
          $("reply").textContent = "";
          break;
        case "response_delta":
          showConvo();
          $("reply").textContent += m.text;
          $("reply").scrollTop = $("reply").scrollHeight;
          break;
        case "response_done":
          if (m.error) setState("error");
          scheduleIdle();
          break;
        case "barge_in":
          $("reply").textContent = "";
          break;
      }
    };

    ws.onclose = () => {
      setState("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }
  connect();

  // ---------- cursor auto-hide ----------
  let cursorTimer = null;
  function nudgeCursor() {
    body.classList.remove("hide-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => body.classList.add("hide-cursor"), 3000);
  }
  document.addEventListener("mousemove", nudgeCursor);
  nudgeCursor();

  // ---------- typed fallback ----------
  // Works before the voice pipeline exists, and stays useful afterwards for
  // anything awkward to say out loud.
  const input = $("typed");
  document.addEventListener("keydown", (e) => {
    if (document.activeElement === input) {
      if (e.key === "Escape") { input.value = ""; input.blur();
                                input.style.display = "none"; }
      if (e.key === "Enter" && input.value.trim() && ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "text_input", text: input.value.trim() }));
        input.value = ""; input.blur(); input.style.display = "none";
      }
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      input.style.display = "block";
      nudgeCursor();
      input.value = e.key;
      input.focus();
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
