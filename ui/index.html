<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  /* This screen is on continuously in a room people live in. Dark by
     default, no pure white anywhere, nothing that pulses when idle. */
  :root {
    --bg:      #0e1116;
    --panel:   #161b22;
    --text:    #e6edf3;
    --dim:     #7d8590;
    --accent:  #4493f8;
    --live:    #3fb950;
    --think:   #d29922;
    --speak:   #a371f7;
    --error:   #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ambient (idle) ---------- */
  #ambient {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.5rem;
  }
  #clock  { font-size: 12rem; font-weight: 200; letter-spacing: -0.04em;
            line-height: 1; font-variant-numeric: tabular-nums; }
  #date   { font-size: 2rem; color: var(--dim); font-weight: 300; }
  #greeting { margin-top: 2.5rem; font-size: 1.5rem; color: var(--dim); }

  /* ---------- conversation ---------- */
  #convo {
    flex: 1; display: none; flex-direction: column;
    padding: 4rem 6rem; gap: 2rem; overflow: hidden;
  }
  #heard {
    font-size: 2.2rem; color: var(--dim); font-weight: 300;
    line-height: 1.35; flex-shrink: 0;
  }
  #heard::before { content: "❝ "; opacity: 0.4; }
  #reply {
    font-size: 3rem; line-height: 1.4; font-weight: 300;
    overflow-y: auto; flex: 1;
  }
  #reply::-webkit-scrollbar { width: 0; }

  /* Deliberately quiet. Sources are reference, not content — legible from
     across the room only if you go looking for them. */
  #sources {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem;
    margin-top: 1rem; font-size: 1.1rem; opacity: 0.45;
  }
  #sources:empty { display: none; }
  .src-label { text-transform: uppercase; letter-spacing: 0.12em;
               font-size: 0.85rem; opacity: 0.7; }
  .src { padding: 0.15rem 0.6rem; border: 1px solid currentColor;
         border-radius: 999px; opacity: 0.9; }


  /* ---------- board (lists + reminders) ----------
     Read from across a room, not from a desk chair. Columns rather than one
     long scroll, because a list you have to scroll is a list you stop
     checking. Nothing animates: this can be on screen for hours. */
  #board {
    flex: 1; display: none; flex-direction: column;
    padding: 3rem 4rem 2rem; gap: 2rem; overflow: hidden;
  }
  body.board-on #board { display: flex; }
  body.board-on #ambient, body.board-on #convo { display: none !important; }

  #board-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 2rem; border-bottom: 1px solid #30363d; padding-bottom: 1rem;
    flex-shrink: 0;
  }
  #board-title { font-size: 2rem; font-weight: 300; letter-spacing: -0.01em; }
  #board-stats { display: flex; gap: 2rem; margin-left: auto; margin-right: 2rem; }
  .bstat { display: flex; align-items: baseline; gap: 0.4rem; }
  .bstat b { font-size: 1.8rem; font-weight: 400;
             font-variant-numeric: tabular-nums; }
  .bstat span { font-size: 0.85rem; color: var(--dim);
                text-transform: uppercase; letter-spacing: 0.1em; }
  #board-clock {
    font-size: 2rem; font-weight: 300; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  #board-cols {
    flex: 1; display: grid; gap: 1.5rem; overflow: hidden;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    align-content: start;
  }
  .card {
    background: var(--panel); border-radius: 0.75rem; padding: 1.4rem 1.6rem;
    display: flex; flex-direction: column; gap: 0.9rem; min-height: 0;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 0.75rem; flex-shrink: 0;
  }
  .card-title {
    font-size: 1.15rem; font-weight: 500; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--accent);
  }
  .card-count {
    font-size: 1rem; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .card ul { list-style: none; display: flex; flex-direction: column;
             gap: 0.55rem; overflow-y: auto; min-height: 0; }
  .card ul::-webkit-scrollbar { width: 0; }
  .card li { font-size: 1.5rem; font-weight: 300; line-height: 1.25; }
  .card li::before { content: "· "; color: var(--dim); }
  /* Completed work stays on the board rather than vanishing — seeing what
     you got through is half the point of having one. Dimmed hard so it
     never competes with what is still outstanding. */
  .card li.done { opacity: 0.35; text-decoration: line-through; }
  .card li.done::before { content: "✓ "; text-decoration: none; }
  .card.empty-board { opacity: 0.5; }
  .card.rem li::before { content: ""; }
  .card.rem .when {
    display: block; font-size: 1rem; color: var(--think); margin-top: 0.1rem;
  }
  .empty { font-size: 1.3rem; color: var(--dim); font-weight: 300; }

  #board-foot {
    display: flex; gap: 2rem; color: var(--dim); font-size: 0.95rem;
    border-top: 1px solid #30363d; padding-top: 0.9rem; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- case (investigation checklist) ----------
     Read at a desk, not across a room, so the type is smaller and denser than
     the board. This is a working document you glance at forty times an hour
     while doing something else, and every row you have to scroll to is a row
     you stop checking. Two columns, each scrolling on its own. */
  #case {
    flex: 1; display: none; flex-direction: column;
    padding: 2rem 2.5rem 1rem; gap: 1.25rem; overflow: hidden;
  }
  body.case-on #case { display: flex; }
  body.case-on #ambient,
  body.case-on #convo,
  body.case-on #board { display: none !important; }

  #case-head {
    display: flex; align-items: center; gap: 1.25rem;
    border-bottom: 1px solid #30363d; padding-bottom: 0.9rem; flex-shrink: 0;
  }
  #case-title { font-size: 1.6rem; font-weight: 400; letter-spacing: -0.01em; }
  .chip {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
    padding: 0.2rem 0.6rem; border: 1px solid currentColor;
    border-radius: 999px; color: var(--dim); white-space: nowrap;
  }
  .chip.sev { color: var(--think); }
  #case-spacer { margin-left: auto; }
  #case-prog {
    font-size: 1.1rem; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  /* The countdown is the whole reason this screen exists, so it is the
     largest thing on it and it changes colour rather than needing to be
     read carefully. */
  #case-clock {
    font-size: 2.6rem; font-weight: 300; font-variant-numeric: tabular-nums;
    line-height: 1; color: var(--live);
  }
  #case-clock.warn { color: var(--think); }
  #case-clock.late { color: var(--error); }
  #case-clock small {
    display: block; font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim); margin-top: 0.3rem;
    font-weight: 400;
  }

  #case-cols {
    flex: 1; display: grid; gap: 1.5rem; min-height: 0;
    grid-template-columns: 1fr 1fr;
  }
  .case-col {
    background: var(--panel); border-radius: 0.75rem; padding: 1.1rem 1.3rem;
    display: flex; flex-direction: column; gap: 0.7rem; min-height: 0;
  }
  .case-col > h2 {
    font-size: 0.9rem; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
    display: flex; justify-content: space-between; align-items: baseline;
    flex-shrink: 0;
  }
  .case-col > h2 em {
    font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .bar { height: 3px; border-radius: 2px; background: #30363d; flex-shrink: 0; }
  .bar i { display: block; height: 100%; border-radius: 2px;
           background: var(--accent); transition: width 0.3s ease; }
  .steps { list-style: none; overflow-y: auto; min-height: 0;
           display: flex; flex-direction: column; gap: 0.1rem; }
  .steps::-webkit-scrollbar { width: 0; }
  .phase {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); margin: 0.85rem 0 0.35rem;
  }
  .phase:first-child { margin-top: 0; }
  .step {
    display: flex; gap: 0.6rem; align-items: baseline;
    font-size: 1.05rem; font-weight: 300; line-height: 1.35;
    padding: 0.2rem 0;
  }
  .step .box { color: var(--dim); flex-shrink: 0; font-size: 0.95rem; }
  .step.done .box { color: var(--live); }
  /* Dim and strike the LABEL only, never the whole step. text-decoration
     inherits down into descendants and cannot be switched off from inside,
     so a line-through on the row draws straight through the finding too —
     which is the one line on a completed step you still want to read. */
  .step.done .label { opacity: 0.32; text-decoration: line-through; }
  /* What he found, hanging off the step it belongs to. This is the part that
     turns the write-up at the end into transcription rather than recall, so
     it stays legible after the step is ticked. */
  .step .found {
    display: block; font-size: 0.9rem; color: var(--think);
    margin-top: 0.15rem; opacity: 0.85;
  }
  /* The step you are on. */
  .step.next .label { color: var(--text); font-weight: 400; }
  .step.next .box { color: var(--accent); }

  /* One column means a workout: read from across a garage, mid-set, not from
     a desk chair. Everything steps up a size and the current exercise is the
     only thing at full brightness. */
  #case-cols.solo .step { font-size: 1.5rem; padding: 0.35rem 0; }
  #case-cols.solo .step .box { font-size: 1.3rem; }
  #case-cols.solo .step .found { font-size: 1.15rem; }
  #case-cols.solo .phase { font-size: 0.9rem; margin: 1.2rem 0 0.5rem; }
  #case-cols.solo .case-col > h2 { font-size: 1.1rem; }
  #case-cols.solo .step.next .label { font-size: 1.9rem; line-height: 1.15; }

  #case-foot {
    display: flex; gap: 1.5rem; align-items: baseline; color: var(--dim);
    font-size: 0.95rem; border-top: 1px solid #30363d; padding-top: 0.75rem;
    flex-shrink: 0; min-height: 1.4rem;
  }
  #case-said { color: var(--text); opacity: 0.75;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- status bar ---------- */
  #bar {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.25rem 2rem; background: var(--panel);
    border-top: 1px solid #21262d; flex-shrink: 0;
  }
  #dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--dim); flex-shrink: 0;
    transition: background 0.25s ease;
  }
  #status { font-size: 1.3rem; letter-spacing: 0.02em; }
  #meta { margin-left: auto; font-size: 1rem; color: var(--dim);
          font-variant-numeric: tabular-nums; }

  /* Only animate when the device is actually doing something — an idle
     screen that pulses all night is a screen people cover with a towel. */
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  .state-idle         #dot { background: var(--dim); }
  .state-listening    #dot { background: var(--live); }
  .state-transcribing #dot { background: var(--live); }
  .state-thinking     #dot { background: var(--think); }
  .state-speaking     #dot { background: var(--speak); }
  .state-error        #dot { background: var(--error); }
  .state-offline      #dot { background: var(--error); }

  /* ---------- typed fallback ---------- */
  #typed {
    position: fixed; left: 50%; bottom: 7rem; transform: translateX(-50%);
    width: min(70ch, 80vw); padding: 1rem 1.25rem; font-size: 1.4rem;
    background: var(--panel); color: var(--text);
    border: 1px solid #30363d; border-radius: 10px;
    display: none; outline: none;
  }
  #typed:focus { border-color: var(--accent); }

  /* Kiosk cursor policy: visible while the mouse is moving, gone after a
     few seconds of stillness. Always-hidden looks right on the finished
     appliance and is maddening while you are testing in a browser tab. */
  body.hide-cursor, body.hide-cursor * { cursor: none; }
</style>
</head>
<body class="state-idle">

  <div id="ambient">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="greeting"></div>
  </div>

  <div id="convo">
    <div id="heard"></div>
    <div id="reply"></div>
    <!-- Sources appear only when the model actually cited something. The
         spoken reply never reads a URL aloud, so this is where that half of
         the answer lives. -->
    <div id="sources"></div>
  </div>


  <div id="board">
    <div id="board-head">
      <div id="board-title">Boards</div>
      <div id="board-stats"></div>
      <div id="board-clock"></div>
    </div>
    <div id="board-cols"></div>
    <div id="board-foot"></div>
  </div>

  <div id="case">
    <div id="case-head">
      <div id="case-title">Case</div>
      <div class="chip" id="case-ref" hidden></div>
      <div class="chip sev" id="case-sev" hidden></div>
      <div id="case-spacer"></div>
      <div id="case-prog"></div>
      <div id="case-clock">--:--<small>sla</small></div>
    </div>
    <div id="case-cols"></div>
    <div id="case-foot"><span id="case-said"></span></div>
  </div>

  <input id="typed" placeholder="Type a question, Enter to send, Esc to dismiss"
         autocomplete="off" spellcheck="false">

  <div id="bar">
    <div id="dot"></div>
    <div id="status">Starting…</div>
    <div id="meta"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  let name = "Assistant", idleTimer = null, ws = null, backoff = 500;

  const LABELS = {
    idle:         "Ready",
    listening:    "Listening…",
    transcribing: "Got it…",
    thinking:     "Thinking…",
    speaking:     "Speaking",
    error:        "Something went wrong",
    offline:      "Orchestrator offline",
  };

  // ---------- clock ----------
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], {
      hour: "numeric", minute: "2-digit"
    });
    $("date").textContent = d.toLocaleDateString([], {
      weekday: "long", month: "long", day: "numeric"
    });
  }
  tick();
  setInterval(tick, 1000);

  // ---------- views ----------
  function showAmbient() {
    $("ambient").style.display = "flex";
    $("convo").style.display = "none";
  }
  function showConvo() {
    clearTimeout(idleTimer);
    $("ambient").style.display = "none";
    $("convo").style.display = "flex";
  }
  function scheduleIdle(ms = 45000) {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showAmbient, ms);
  }

  function setState(state, detail) {
    // Remove ONLY the state-* class. Assigning body.className wholesale
    // destroys every other class on the element, which is a bug that keeps
    // coming back wearing different clothes: first it ate hide-cursor, and
    // then it silently ate board-on — showBoard() added the class, the
    // websocket connected, the server sent its opening "idle" state, and the
    // fully-rendered board vanished behind display:none a moment later.
    // Preserving one class by name fixes one symptom; this fixes the cause.
    Array.from(body.classList)
      .filter((c) => c.startsWith("state-"))
      .forEach((c) => body.classList.remove(c));
    body.classList.add("state-" + state);
    $("status").textContent = LABELS[state] || state;
    $("status").classList.toggle(
      "pulse", ["listening", "transcribing", "thinking"].includes(state)
    );
    $("meta").textContent = detail ? detail + " tier" : "";
    if (state === "idle") scheduleIdle();
  }

  // ---------- socket ----------
  // Sources are built with textContent, never innerHTML. The titles come
  // from web pages the model chose, which makes them untrusted input, and a
  // kiosk browser is the last place you want to render someone else's markup.
  function renderSources(list) {
    const box = $("sources");
    box.textContent = "";
    if (!list || !list.length) return;
    const label = document.createElement("span");
    label.className = "src-label";
    label.textContent = list.length === 1 ? "Source" : "Sources";
    box.appendChild(label);
    list.slice(0, 5).forEach(s => {
      const item = document.createElement("span");
      item.className = "src";
      let host = s.url;
      try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch (e) {}
      item.textContent = host;
      item.title = s.title || s.url;
      box.appendChild(item);
    });
  }


  // ---------- board ----------
  // Two modes from one file: /dashboard pins it on permanently, and a voice
  // request shows it for a while over the conversation view. Sharing the
  // renderer means there is only ever one thing to keep correct.
  const BOARD_PINNED = new URLSearchParams(location.search).has("board")
                       || location.pathname.startsWith("/dashboard");
  const BOARD_SECONDS = 90;
  let boardTimer = null, boardPoll = null;

  async function loadBoard() {
    try {
      const r = await fetch("/board", { cache: "no-store" });
      renderBoard(await r.json());
    } catch (e) {
      // A failed refresh leaves the last good render up, which is the right
      // behaviour for a screen on a wall: stale beats blank.
    }
  }

  function renderBoard(d) {
    $("board-clock").textContent = new Date().toLocaleTimeString([], {
      hour: "numeric", minute: "2-digit" });
    const cols = $("board-cols");
    cols.textContent = "";

    const stats = $("board-stats");
    stats.textContent = "";
    [[d.open_total ?? 0, "open"], [d.done_today ?? 0, "done today"]]
      .forEach(([n, label]) => {
        const w = document.createElement("div"); w.className = "bstat";
        const b = document.createElement("b"); b.textContent = n;
        const s = document.createElement("span"); s.textContent = label;
        w.append(b, s); stats.appendChild(w);
      });

    if (d.reminders && d.reminders.length) {
      cols.appendChild(card("Reminders", d.reminders.map(r => ({
        text: r.text, sub: r.when })), true));
    }
    (d.lists || []).forEach(l => {
      const items = (l.items || []).map(t => ({ text: t }))
        .concat((l.done || []).map(t => ({ text: t, done: true })));
      cols.appendChild(card(l.title, items));
    });
    if (!cols.children.length) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Nothing on any board.";
      cols.appendChild(p);
    }

    const foot = $("board-foot");
    foot.textContent = "";
    [`${d.name} · ${d.audio_ok ? "listening" : "microphone offline"}`,
     `24h spend $${(d.spend_24h_usd ?? 0).toFixed(3)}`].forEach(t => {
      const s = document.createElement("span"); s.textContent = t;
      foot.appendChild(s);
    });
  }

  // Built with textContent throughout — list items are things people said
  // out loud and were transcribed, so they are untrusted text, and this
  // browser is running in kiosk mode with nobody watching it.
  function card(title, items, isRem) {
    const openCount = items.filter(i => !i.done).length;
    const el = document.createElement("div");
    el.className = "card" + (isRem ? " rem" : "")
                 + (openCount ? "" : " empty-board");
    const head = document.createElement("div");
    head.className = "card-head";
    const h = document.createElement("div");
    h.className = "card-title"; h.textContent = title;
    const c = document.createElement("div");
    c.className = "card-count"; c.textContent = openCount || "";
    head.append(h, c); el.appendChild(head);

    if (!items.length) {
      const p = document.createElement("div");
      p.className = "empty"; p.textContent = "clear";
      el.appendChild(p);
    } else {
      const ul = document.createElement("ul");
      items.forEach(it => {
        const li = document.createElement("li");
        if (it.done) li.className = "done";
        li.textContent = it.text;
        if (it.sub) {
          const w = document.createElement("span");
          w.className = "when"; w.textContent = it.sub;
          li.appendChild(w);
        }
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }
    return el;
  }

  function showBoard(seconds) {
    // The case overlay sits on top of the board, so it has to step aside
    // rather than the board quietly rendering underneath it.
    hideCase();
    document.body.classList.add("board-on");
    loadBoard();
    clearInterval(boardPoll);
    boardPoll = setInterval(loadBoard, 15000);
    clearTimeout(boardTimer);
    if (!BOARD_PINNED && seconds) {
      boardTimer = setTimeout(hideBoard, seconds * 1000);
    }
  }

  function hideBoard() {
    if (BOARD_PINNED) return;
    document.body.classList.remove("board-on");
    clearInterval(boardPoll); boardPoll = null;
    clearTimeout(boardTimer); boardTimer = null;
    // Asking for the shopping list mid-investigation should not cost you the
    // checklist. The board has its ninety seconds and then the case comes
    // back, because the case is the thing with a deadline on it.
    if (caseData) showCase();
  }

  // NB: the pinned dashboard is started at the bottom of the case section,
  // not here. showBoard() now stands the case overlay down, and hideCase()
  // touches `casePoll`, which is declared below — calling it from up here
  // hits the temporal dead zone and the whole script dies on /dashboard.


  // ---------- case ----------
  // Unlike the board, this does NOT time out. An investigation checklist that
  // vanishes after ninety seconds is a checklist you have to keep asking for,
  // and asking for it is exactly the friction the whole feature exists to
  // remove. It goes up when a case opens and stays up until the case closes.
  let caseData = null, casePoll = null, caseTick = null, caseSkew = 0;
  let caseLastDone = -1;

  async function loadCase() {
    try {
      const r = await fetch("/case", { cache: "no-store" });
      const d = await r.json();
      if (!d.active) { endCase(); return; }
      // The server tells us its own clock. Counting down against an absolute
      // deadline using a browser clock that is a minute out would put the
      // wrong number on the wall, and this is the one number on this screen
      // somebody is actually relying on.
      if (d.now) caseSkew = d.now - Date.now() / 1000;
      caseData = d;
      renderCase(d);
      showCase();
    } catch (e) {
      // Keep the last good render. Stale beats blank on a wall display.
    }
  }

  function fmtLeft(secs) {
    const late = secs < 0;
    let s = Math.floor(Math.abs(secs));
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const pad = (n) => String(n).padStart(2, "0");
    const body = h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    return (late ? "+" : "") + body;
  }

  function paintClock() {
    if (!caseData) return;
    const el = $("case-clock");
    if (!caseData.sla_due) {
      // No deadline — a workout. Count UP instead. Session length is the
      // number you want mid-set; "no SLA" tells you nothing.
      const up = Date.now() / 1000 + caseSkew - caseData.opened;
      el.textContent = fmtLeft(Math.max(0, up));
      el.className = "";
      const lbl = document.createElement("small");
      lbl.textContent = "elapsed"; el.appendChild(lbl);
      return;
    }
    const now = Date.now() / 1000 + caseSkew;
    const left = caseData.sla_due - now;
    const span = Math.max(1, caseData.sla_due - caseData.opened);
    const gone = 1 - left / span;

    el.textContent = fmtLeft(left);
    el.className = left < 0 ? "late" : (gone >= 0.75 ? "warn" : "");
    const lbl = document.createElement("small");
    lbl.textContent = left < 0 ? "sla breached" : "sla remaining";
    el.appendChild(lbl);
  }

  function renderCase(d) {
    $("case-title").textContent = d.title || "Case";
    const ref = $("case-ref");
    ref.hidden = !d.ref; ref.textContent = d.ref || "";
    const sev = $("case-sev");
    sev.hidden = !d.severity; sev.textContent = d.severity || "";
    $("case-prog").textContent = `${d.done_total}/${d.step_total}`;
    paintClock();

    const cols = $("case-cols");
    cols.textContent = "";
    // The server says which columns exist. A workout has one; an
    // investigation has two. Hard-coding the pair here is what would put an
    // empty "My tasks" panel next to your bench press.
    const spec = d.columns
      || [{key: "investigation", label: "Investigation"},
          {key: "admin", label: "My tasks"}];
    cols.style.gridTemplateColumns =
      spec.length === 1 ? "minmax(0, 46rem)" : "repeat(" + spec.length + ", 1fr)";
    cols.style.justifyContent = spec.length === 1 ? "center" : "stretch";
    cols.classList.toggle("solo", spec.length === 1);
    spec.forEach((c) => {
      cols.appendChild(caseColumn(c.label, (d.sides || {})[c.key] || []));
    });

    // Keep the step you are on in view. Only when something was actually
    // ticked — scrolling on every fifteen-second poll would yank the column
    // back under you while you were reading further down it.
    if (d.done_total !== caseLastDone) {
      caseLastDone = d.done_total;
      requestAnimationFrame(() => {
        cols.querySelectorAll(".step.next").forEach((el) =>
          el.scrollIntoView({ block: "center", behavior: "smooth" }));
      });
    }
  }

  // textContent throughout. Step text comes from a YAML file, but findings
  // are transcribed speech, and this browser runs in kiosk mode with nobody
  // watching it.
  function caseColumn(label, steps) {
    const done = steps.filter(s => s.done).length;
    const col = document.createElement("div");
    col.className = "case-col";

    const h = document.createElement("h2");
    h.textContent = label;
    const n = document.createElement("em");
    n.textContent = `${done}/${steps.length}`;
    h.appendChild(n);
    col.appendChild(h);

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = steps.length
      ? `${Math.round((done / steps.length) * 100)}%` : "0%";
    bar.appendChild(fill);
    col.appendChild(bar);

    const ul = document.createElement("ul");
    ul.className = "steps";
    // A column with one phase does not need a phase heading — it would just
    // restate the column title one line below itself.
    const multiPhase = new Set(steps.map(s => s.phase || "")).size > 1;
    let phase = null, markedNext = false;
    steps.forEach((s) => {
      if (multiPhase && s.phase && s.phase !== phase) {
        phase = s.phase;
        const p = document.createElement("li");
        p.className = "phase"; p.textContent = phase;
        ul.appendChild(p);
      }
      const li = document.createElement("li");
      li.className = "step" + (s.done ? " done" : "");
      if (!s.done && !markedNext) { li.classList.add("next"); markedNext = true; }

      const box = document.createElement("span");
      box.className = "box"; box.textContent = s.done ? "✓" : "○";
      const txt = document.createElement("span");
      txt.className = "txt";
      const label = document.createElement("span");
      label.className = "label"; label.textContent = s.text;
      txt.appendChild(label);
      if (s.finding) {
        const f = document.createElement("span");
        f.className = "found"; f.textContent = s.finding;
        txt.appendChild(f);
      }
      li.append(box, txt);
      ul.appendChild(li);
    });
    if (!steps.length) {
      const p = document.createElement("li");
      p.className = "phase"; p.textContent = "nothing here";
      ul.appendChild(p);
    }
    col.appendChild(ul);
    return col;
  }

  function showCase() {
    document.body.classList.add("case-on");
    // Tear the board down directly rather than through hideBoard(), which
    // no-ops on the pinned dashboard. Leaving board-on set would be invisible
    // — the CSS puts the case on top either way — while quietly keeping a
    // /board poll running for the rest of the day.
    document.body.classList.remove("board-on");
    clearInterval(boardPoll); boardPoll = null;
    clearTimeout(boardTimer); boardTimer = null;
    clearInterval(casePoll);
    casePoll = setInterval(loadCase, 15000);
    // The countdown ticks locally every second. Polling alone would move it
    // in fifteen-second jumps, which looks like a frozen clock.
    clearInterval(caseTick);
    caseTick = setInterval(paintClock, 1000);
  }

  function hideCase() {
    document.body.classList.remove("case-on");
    clearInterval(casePoll); casePoll = null;
    clearInterval(caseTick); caseTick = null;
  }

  // The case is over. Drop the data as well as the classes, or hideBoard()
  // will helpfully resurrect a checklist for a finished investigation. On the
  // pinned dashboard the boards come back, which is where that screen lives
  // when nothing is being investigated.
  function endCase() {
    caseData = null;
    caseLastDone = -1;
    hideCase();
    if (BOARD_PINNED) showBoard();
  }

  function caseOn() { return document.body.classList.contains("case-on"); }

  if (BOARD_PINNED) showBoard();

  // Come back up mid-investigation — after a reboot, an update, the USB
  // wedge — and the checklist is already on screen. The case outlived the
  // process, so the display should too. This runs after showBoard() so an
  // open case wins the screen on the dashboard as well.
  loadCase();

  // B toggles the board; C the case; Escape dismisses whichever is up.
  document.addEventListener("keydown", (e) => {
    if (e.key === "b" || e.key === "B") {
      document.body.classList.contains("board-on")
        ? hideBoard() : showBoard(BOARD_SECONDS);
    } else if (e.key === "c" || e.key === "C") {
      caseOn() ? hideCase() : loadCase();
    } else if (e.key === "Escape") { hideBoard(); hideCase(); }
  });

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws/display`);

    ws.onopen = () => { backoff = 500; };

    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      switch (m.type) {
        case "hello":
          name = m.name;
          $("greeting").textContent = `Say “${name}” to begin`;
          break;
        case "state":
          setState(m.state, m.detail);
          break;
        case "show_board":
          showBoard(BOARD_SECONDS);
          break;
        case "show_case":
          loadCase();
          break;
        case "hide_case":
          endCase();
          break;
        case "sla":
          // Warnings land in the footer strip rather than taking the screen.
          // The countdown is already the largest thing on it; a modal would
          // hide the checklist at the exact moment it matters most.
          $("case-said").textContent = m.text;
          break;
        case "transcript":
          hideBoard();
          // Mid-investigation the checklist stays put and the conversation
          // shrinks to one line at the bottom. Swapping a 28-step checklist
          // out for one sentence, every time you speak, is how a screen
          // becomes something you stop looking at.
          if (caseOn()) { $("case-said").textContent = m.text; break; }
          showConvo();
          $("heard").textContent = m.text;
          $("reply").textContent = "";
          $("sources").textContent = "";
          break;
        case "response_delta":
          showConvo();
          $("reply").textContent += m.text;
          $("reply").scrollTop = $("reply").scrollHeight;
          break;
        case "response_done":
          if (m.error) setState("error");
          renderSources(m.sources);
          // The reply accumulated into #reply as usual — it is just hidden
          // under the checklist. Surface the finished sentence in the strip
          // so there is still a record of what was said back.
          if (caseOn()) $("case-said").textContent = $("reply").textContent;
          scheduleIdle();
          break;
        case "barge_in":
          $("reply").textContent = "";
          break;
      }
    };

    ws.onclose = () => {
      setState("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }
  connect();

  // ---------- cursor auto-hide ----------
  let cursorTimer = null;
  function nudgeCursor() {
    body.classList.remove("hide-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => body.classList.add("hide-cursor"), 3000);
  }
  document.addEventListener("mousemove", nudgeCursor);
  nudgeCursor();

  // ---------- typed fallback ----------
  // Works before the voice pipeline exists, and stays useful afterwards for
  // anything awkward to say out loud.
  const input = $("typed");
  document.addEventListener("keydown", (e) => {
    if (document.activeElement === input) {
      if (e.key === "Escape") { input.value = ""; input.blur();
                                input.style.display = "none"; }
      if (e.key === "Enter" && input.value.trim() && ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "text_input", text: input.value.trim() }));
        input.value = ""; input.blur(); input.style.display = "none";
      }
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      input.style.display = "block";
      nudgeCursor();
      input.value = e.key;
      input.focus();
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
