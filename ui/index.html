<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  /* This screen is on continuously in a room people live in. Dark by
     default, no pure white anywhere, nothing that pulses when idle. */
  :root {
    --bg:      #0e1116;
    --panel:   #161b22;
    --text:    #e6edf3;
    --dim:     #7d8590;
    --accent:  #4493f8;
    --live:    #3fb950;
    --think:   #d29922;
    --speak:   #a371f7;
    --error:   #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ambient (idle) ---------- */
  #ambient {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.5rem;
  }
  #clock  { font-size: 12rem; font-weight: 200; letter-spacing: -0.04em;
            line-height: 1; font-variant-numeric: tabular-nums; }
  #date   { font-size: 2rem; color: var(--dim); font-weight: 300; }
  #greeting { margin-top: 2.5rem; font-size: 1.5rem; color: var(--dim); }

  /* ---------- conversation ---------- */
  #convo {
    flex: 1; display: none; flex-direction: column;
    padding: 4rem 6rem; gap: 2rem; overflow: hidden;
  }
  #heard {
    font-size: 2.2rem; color: var(--dim); font-weight: 300;
    line-height: 1.35; flex-shrink: 0;
  }
  #heard::before { content: "❝ "; opacity: 0.4; }
  #reply {
    font-size: 3rem; line-height: 1.4; font-weight: 300;
    overflow-y: auto; flex: 1;
  }
  #reply::-webkit-scrollbar { width: 0; }

  /* Deliberately quiet. Sources are reference, not content — legible from
     across the room only if you go looking for them. */
  #sources {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem;
    margin-top: 1rem; font-size: 1.1rem; opacity: 0.45;
  }
  #sources:empty { display: none; }
  .src-label { text-transform: uppercase; letter-spacing: 0.12em;
               font-size: 0.85rem; opacity: 0.7; }
  .src { padding: 0.15rem 0.6rem; border: 1px solid currentColor;
         border-radius: 999px; opacity: 0.9; }


  /* ---------- board (lists + reminders) ----------
     Read from across a room, not from a desk chair. Columns rather than one
     long scroll, because a list you have to scroll is a list you stop
     checking. Nothing animates: this can be on screen for hours. */
  #board {
    flex: 1; display: none; flex-direction: column;
    padding: 3rem 4rem 2rem; gap: 2rem; overflow: hidden;
  }
  body.board-on #board { display: flex; }
  body.board-on #ambient, body.board-on #convo { display: none !important; }

  #board-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 2rem; border-bottom: 1px solid #30363d; padding-bottom: 1rem;
    flex-shrink: 0;
  }
  #board-title { font-size: 2rem; font-weight: 300; letter-spacing: -0.01em; }
  #board-stats { display: flex; gap: 2rem; margin-left: auto; margin-right: 2rem; }
  .bstat { display: flex; align-items: baseline; gap: 0.4rem; }
  .bstat b { font-size: 1.8rem; font-weight: 400;
             font-variant-numeric: tabular-nums; }
  .bstat span { font-size: 0.85rem; color: var(--dim);
                text-transform: uppercase; letter-spacing: 0.1em; }
  #board-clock {
    font-size: 2rem; font-weight: 300; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  #board-cols {
    flex: 1; display: grid; gap: 1.5rem; overflow: hidden;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    align-content: start;
  }
  .card {
    background: var(--panel); border-radius: 0.75rem; padding: 1.4rem 1.6rem;
    display: flex; flex-direction: column; gap: 0.9rem; min-height: 0;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 0.75rem; flex-shrink: 0;
  }
  .card-title {
    font-size: 1.15rem; font-weight: 500; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--accent);
  }
  .card-count {
    font-size: 1rem; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .card ul { list-style: none; display: flex; flex-direction: column;
             gap: 0.55rem; overflow-y: auto; min-height: 0; }
  .card ul::-webkit-scrollbar { width: 0; }
  .card li { font-size: 1.5rem; font-weight: 300; line-height: 1.25; }
  .card li::before { content: "· "; color: var(--dim); }
  /* Completed work stays on the board rather than vanishing — seeing what
     you got through is half the point of having one. Dimmed hard so it
     never competes with what is still outstanding. */
  .card li.done { opacity: 0.35; text-decoration: line-through; }
  .card li.done::before { content: "✓ "; text-decoration: none; }
  .card.empty-board { opacity: 0.5; }
  .card.rem li::before { content: ""; }
  .card.rem .when {
    display: block; font-size: 1rem; color: var(--think); margin-top: 0.1rem;
  }
  .empty { font-size: 1.3rem; color: var(--dim); font-weight: 300; }

  #board-foot {
    display: flex; gap: 2rem; color: var(--dim); font-size: 0.95rem;
    border-top: 1px solid #30363d; padding-top: 0.9rem; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- case (investigation checklist) ----------
     Read at a desk, not across a room, so the type is smaller and denser than
     the board. This is a working document you glance at forty times an hour
     while doing something else, and every row you have to scroll to is a row
     you stop checking. Two columns, each scrolling on its own. */
  #case {
    flex: 1; display: none; flex-direction: column;
    padding: 2rem 2.5rem 1rem; gap: 1.25rem; overflow: hidden;
  }
  body.case-on #case { display: flex; }
  body.case-on #ambient,
  body.case-on #convo,
  body.case-on #board { display: none !important; }

  #case-head {
    display: flex; align-items: center; gap: 1.25rem;
    border-bottom: 1px solid #30363d; padding-bottom: 0.9rem; flex-shrink: 0;
  }
  #case-title { font-size: 1.6rem; font-weight: 400; letter-spacing: -0.01em; }
  .chip {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
    padding: 0.2rem 0.6rem; border: 1px solid currentColor;
    border-radius: 999px; color: var(--dim); white-space: nowrap;
  }
  .chip.sev { color: var(--think); }
  #case-spacer { margin-left: auto; }
  #case-prog {
    font-size: 1.1rem; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  /* The countdown is the whole reason this screen exists, so it is the
     largest thing on it and it changes colour rather than needing to be
     read carefully. */
  #case-clock {
    font-size: 2.6rem; font-weight: 300; font-variant-numeric: tabular-nums;
    line-height: 1; color: var(--live);
  }
  #case-clock.warn { color: var(--think); }
  #case-clock.late { color: var(--error); }
  #case-clock small {
    display: block; font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim); margin-top: 0.3rem;
    font-weight: 400;
  }

  #case-cols {
    flex: 1; display: grid; gap: 1.5rem; min-height: 0;
    grid-template-columns: 1fr 1fr;
  }
  .case-col {
    background: var(--panel); border-radius: 0.75rem; padding: 1.1rem 1.3rem;
    display: flex; flex-direction: column; gap: 0.7rem; min-height: 0;
  }
  .case-col > h2 {
    font-size: 0.9rem; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
    display: flex; justify-content: space-between; align-items: baseline;
    flex-shrink: 0;
  }
  .case-col > h2 em {
    font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .bar { height: 3px; border-radius: 2px; background: #30363d; flex-shrink: 0; }
  .bar i { display: block; height: 100%; border-radius: 2px;
           background: var(--accent); transition: width 0.3s ease; }
  .steps { list-style: none; overflow-y: auto; min-height: 0;
           display: flex; flex-direction: column; gap: 0.1rem; }
  .steps::-webkit-scrollbar { width: 0; }
  .phase {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); margin: 0.85rem 0 0.35rem;
  }
  .phase:first-child { margin-top: 0; }
  .step {
    display: flex; gap: 0.6rem; align-items: baseline;
    font-size: 1.05rem; font-weight: 300; line-height: 1.35;
    padding: 0.2rem 0;
  }
  .step .box { color: var(--dim); flex-shrink: 0; font-size: 0.95rem; }
  .step.done .box { color: var(--live); }
  /* Dim and strike the LABEL only, never the whole step. text-decoration
     inherits down into descendants and cannot be switched off from inside,
     so a line-through on the row draws straight through the finding too —
     which is the one line on a completed step you still want to read. */
  .step.done .label { opacity: 0.32; text-decoration: line-through; }
  /* What he found, hanging off the step it belongs to. This is the part that
     turns the write-up at the end into transcription rather than recall, so
     it stays legible after the step is ticked. */
  .step .found {
    display: block; font-size: 0.9rem; color: var(--think);
    margin-top: 0.15rem; opacity: 0.85;
  }
  /* The step you are on. */
  .step.next .label { color: var(--text); font-weight: 400; }
  .step.next .box { color: var(--accent); }

  /* One column means a workout: read from across a garage, mid-set, not from
     a desk chair. Everything steps up a size and the current exercise is the
     only thing at full brightness. */
  #case-cols.solo .step { font-size: 1.5rem; padding: 0.35rem 0; }
  #case-cols.solo .step .box { font-size: 1.3rem; }
  #case-cols.solo .step .found { font-size: 1.15rem; }
  #case-cols.solo .phase { font-size: 0.9rem; margin: 1.2rem 0 0.5rem; }
  #case-cols.solo .case-col > h2 { font-size: 1.1rem; }
  #case-cols.solo .step.next .label { font-size: 1.9rem; line-height: 1.15; }

  #case-foot {
    display: flex; gap: 1.5rem; align-items: baseline; color: var(--dim);
    font-size: 0.95rem; border-top: 1px solid #30363d; padding-top: 0.75rem;
    flex-shrink: 0; min-height: 1.4rem;
  }
  #case-said { color: var(--text); opacity: 0.75;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- status bar ---------- */
  #bar {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.25rem 2rem; background: var(--panel);
    border-top: 1px solid #21262d; flex-shrink: 0;
  }
  #dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--dim); flex-shrink: 0;
    transition: background 0.25s ease;
  }
  #status { font-size: 1.3rem; letter-spacing: 0.02em; }
  #meta { margin-left: auto; font-size: 1rem; color: var(--dim);
          font-variant-numeric: tabular-nums; }

  /* Only animate when the device is actually doing something — an idle
     screen that pulses all night is a screen people cover with a towel. */
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  .state-idle         #dot { background: var(--dim); }
  .state-listening    #dot { background: var(--live); }
  .state-transcribing #dot { background: var(--live); }
  .state-thinking     #dot { background: var(--think); }
  .state-speaking     #dot { background: var(--speak); }
  .state-error        #dot { background: var(--error); }
  .state-offline      #dot { background: var(--error); }

  /* ---------- the status wall ----------
     The appliance's monitor is pinned to the board, so there is no idle
     clock to replace — this sits under it instead, always there, and stays
     one quiet line while everything is well. It grows only when it has
     something to say, which is the only way a permanent status display
     survives being in a room you live in.

     z-index 30 puts it under the systems check (40) and the timer (60):
     those take the whole screen on purpose and the wall has no business
     fighting them. It polls /status.json, which is a cached read — the
     probes run on the orchestrator's own tick, so a screen left up all day
     costs nothing. */
  #wall {
    position: fixed; left: 0; right: 0; bottom: 4.6rem; z-index: 30;
    display: none; flex-direction: column; gap: 0.35rem;
    padding: 0.7rem 1.4rem;
    background: rgba(13, 17, 23, 0.86);
    border-top: 1px solid #21262d;
    backdrop-filter: blur(6px);
    font-size: 1rem;
  }
  #wall.on { display: flex; }
  #wall-line { display: flex; align-items: center; gap: 1.1rem;
               flex-wrap: wrap; }
  #wall-dot { width: 12px; height: 12px; border-radius: 50%;
              background: var(--dim); flex-shrink: 0; }
  #wall.ok   #wall-dot { background: var(--live); }
  #wall.warn #wall-dot { background: var(--think);
                         box-shadow: 0 0 10px var(--think); }
  #wall.fail #wall-dot { background: var(--error);
                         box-shadow: 0 0 10px var(--error); }
  #wall-word { font-weight: 600; letter-spacing: 0.01em; }
  #wall.ok #wall-word { color: var(--dim); font-weight: 400; }
  #wall-groups { display: flex; gap: 1rem; flex-wrap: wrap;
                 color: var(--dim); font-size: 0.92rem; }
  #wall-groups .g { display: flex; align-items: center; gap: 0.35rem; }
  #wall-groups .g i { width: 8px; height: 8px; border-radius: 50%;
                      background: var(--live); display: inline-block;
                      font-style: normal; }
  #wall-groups .g.warn i { background: var(--think); }
  #wall-groups .g.fail i { background: var(--error); }
  #wall-groups .g.skip i { background: #484f58; }
  #wall-age { margin-left: auto; color: #484f58; font-size: 0.82rem;
              font-variant-numeric: tabular-nums; }
  #wall-age.stale { color: var(--error); }
  /* Problems, with the fix, because a status line that says "printer: fail"
     and stops has turned a known problem into a mystery. */
  #wall-bad { display: flex; flex-direction: column; gap: 0.3rem; }
  #wall-bad .b { display: flex; gap: 0.6rem; align-items: baseline;
                 font-size: 0.95rem; }
  #wall-bad .b .n { font-weight: 600; flex-shrink: 0; }
  #wall-bad .b .d { color: var(--dim); }
  #wall-bad .b .f { color: var(--think); }

  /* ---------- the always-on status pill ----------
     The bar at the bottom says the same thing, but every full-bleed panel
     covers it — the timer, the systems check, the case overlay — and those
     are exactly the moments you are across the room wondering whether she
     heard you. So: one small thing, fixed to the top right, above
     everything, never hidden by a panel.

     z-index 100 puts it over the timer (60) and the check (40). It is
     deliberately small and low-contrast when idle: a status light you
     notice only when it changes is doing its job. */
  #pill {
    position: fixed; top: 1.4vh; right: 1.4vw; z-index: 100;
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.5rem 0.95rem 0.5rem 0.8rem; border-radius: 999px;
    background: rgba(13, 17, 23, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(8px);
    font-size: 1.05rem; letter-spacing: 0.01em; line-height: 1;
    color: var(--text); opacity: 0.55;
    transition: opacity 0.25s ease, border-color 0.25s ease;
    pointer-events: none; user-select: none;
  }
  /* Anything that is not "ready" is worth reading, so it comes forward. */
  body:not(.state-idle) #pill { opacity: 1; }

  #pill-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--dim); flex-shrink: 0;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .state-idle         #pill-dot { background: var(--dim); }
  .state-listening    #pill-dot,
  .state-transcribing #pill-dot { background: var(--live);
                                  box-shadow: 0 0 10px var(--live); }
  .state-thinking     #pill-dot { background: var(--think);
                                  box-shadow: 0 0 10px var(--think); }
  .state-speaking     #pill-dot { background: var(--speak);
                                  box-shadow: 0 0 10px var(--speak); }
  .state-error        #pill-dot,
  .state-offline      #pill-dot { background: var(--error);
                                  box-shadow: 0 0 10px var(--error); }
  /* Offline is the one state that should be impossible to miss or mistake
     for a passing mood — nothing is going to answer until it clears. */
  .state-offline #pill { opacity: 1;
                         border-color: rgba(240, 115, 111, 0.55); }

  /* The timer paints the whole screen, so the pill needs its own ground to
     stay legible on green and on amber. */
  #timer.on ~ #pill, #check.on ~ #pill {
    background: rgba(0, 0, 0, 0.55);
    border-color: rgba(255, 255, 255, 0.16);
  }

  /* ---------- typed fallback ---------- */
  #typed {
    position: fixed; left: 50%; bottom: 7rem; transform: translateX(-50%);
    width: min(70ch, 80vw); padding: 1rem 1.25rem; font-size: 1.4rem;
    background: var(--panel); color: var(--text);
    border: 1px solid #30363d; border-radius: 10px;
    display: none; outline: none;
  }
  #typed:focus { border-color: var(--accent); }

  /* Kiosk cursor policy: visible while the mouse is moving, gone after a
     few seconds of stillness. Always-hidden looks right on the finished
     appliance and is maddening while you are testing in a browser tab. */
  body.hide-cursor, body.hide-cursor * { cursor: none; }

  /* ---------- systems check ----------------------------------------
     Same shape as the case overlay: full bleed, its own header strip, and
     a footer that carries one line of context. Laid out in columns by
     group so twenty-six rows fit without scrolling — a check you have to
     scroll is a check whose worst item you might not see. */
  #check {
    position: fixed; inset: 0; display: none;
    flex-direction: column; background: var(--bg, #0b0d10);
    padding: 2.2vh 2.4vw; z-index: 40;
  }
  #check.on { display: flex; }
  /* The status pill is fixed to the top right above everything, so the
     panel's own header has to get out from under it. Only when resting:
     a one-off report is dismissed in a few seconds and the overlap does
     not matter, but this one is on screen all day. */
  #check.resting #check-head { padding-right: 13rem; }
  #check-head {
    display: flex; align-items: center; gap: 0.8rem;
    padding-bottom: 1.1vh; border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  #check-title { font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
  #check-spacer { flex: 1; }
  #check-when { font-size: 1.1rem; opacity: 0.55; font-variant-numeric: tabular-nums; }
  #check-verdict {
    font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.22rem 0.6rem; border-radius: 3px;
  }
  #check-verdict.ok   { background: rgba(88,190,130,0.18); color: #7fd4a2; }
  #check-verdict.warn { background: rgba(224,164,95,0.18); color: #e6b071; }
  #check-verdict.fail { background: rgba(224,90,110,0.20); color: #f08494; }
  /* Multi-column rather than grid: groups are wildly different lengths
     (Hardware has four checks, State has six), and a grid leaves a hole
     under the short ones while squeezing every row. Columns flow and
     balance, so the rows get wide enough that a name like "microphone on
     the bus" stops wrapping onto two lines. */
  #check-groups {
    flex: 1; column-width: 30rem; column-gap: 2.6vw; column-fill: balance;
    padding-top: 1.4vh; overflow: hidden;
  }
  .cgroup { break-inside: avoid; margin-bottom: 1.6vh; }
  .cgroup h3 {
    font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
    opacity: 0.45; margin: 0 0 0.35rem; font-weight: 500;
  }
  .crow {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding: 0.14rem 0; font-size: 1.12rem;
  }
  .crow .dot {
    width: 0.52rem; height: 0.52rem; border-radius: 50%; flex: none;
    transform: translateY(-0.1rem);
  }
  .crow.ok   .dot { background: #4f9d73; }
  .crow.warn .dot { background: #e0a45f; }
  .crow.fail .dot { background: #e05a6e; }
  .crow.skip .dot { background: rgba(255,255,255,0.18); }
  .crow .nm { flex: 1; }
  .crow.ok .nm, .crow.skip .nm { opacity: 0.62; }
  .crow.fail .nm { font-weight: 600; }
  /* The detail sits right of the name and never pushes it around: the name
     is what you scan for, so it keeps its space and the detail gives way. */
  .crow .dt {
    opacity: 0.5; font-size: 0.92rem; text-align: right;
    flex: 0 1 auto; min-width: 0;
  }
  .crow .nm { flex: 1 1 auto; min-width: 9rem; }
  .crow.fail .dt, .crow.warn .dt { opacity: 0.8; }
  .cfix {
    font-size: 0.92rem; opacity: 0.62; margin: 0 0 0.3rem 1.02rem;
    padding-left: 0.6rem; border-left: 2px solid rgba(255,255,255,0.14);
  }
  #check-foot {
    padding-top: 1vh; border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 1.05rem; opacity: 0.7; min-height: 1.6rem;
  }

  /* ---------- interval timer ---------------------------------------
     Read from the floor, mid-burpee, upside down. That is the whole brief,
     and it is why the clock is enormous and nothing else competes with it.
     Colour carries the phase so you know what to do before you have read a
     word: green means move, amber means breathe. */
  #timer {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4vh; z-index: 60;
    background: var(--bg, #0b0d10);
    transition: background 220ms ease;
  }
  #timer.on { display: flex; }
  #timer.work  { background: #0c1a12; }
  #timer.rest  { background: #1b1408; }
  #timer.ready { background: #0d1119; }
  #timer.run, #timer.mark { background: #0c1a12; }

  #timer-name {
    font-size: 1.6rem; opacity: 0.4; letter-spacing: 0.02em;
    text-align: center; padding: 0 4vw;
  }
  #timer-label {
    font-size: 5.5rem; font-weight: 600; line-height: 1;
    letter-spacing: -0.02em; margin-top: 1vh;
  }
  #timer.work  #timer-label { color: #63d68f; }
  #timer.run   #timer-label,
  #timer.mark  #timer-label { color: #63d68f; }
  #timer.rest  #timer-label { color: #e8ae5c; }
  #timer.ready #timer-label { color: #8fa6c4; }

  /* Tabular numerals, or the clock jitters sideways every second and your
     eye has to re-find it — which is exactly what you cannot spare. */
  #timer-clock {
    font-size: 26vh; font-weight: 200; line-height: 0.92;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  #timer.urgent #timer-clock { color: #f0736f; }

  #timer-round {
    font-size: 3rem; font-weight: 300; opacity: 0.75;
    font-variant-numeric: tabular-nums;
  }
  #timer-bar {
    width: 62vw; height: 0.9vh; margin-top: 2.2vh;
    background: rgba(255,255,255,0.10); border-radius: 99px; overflow: hidden;
  }
  #timer-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: rgba(255,255,255,0.55);
    transition: width 900ms linear;
  }
  #timer-left { font-size: 1.5rem; opacity: 0.45; margin-top: 1.4vh;
                font-variant-numeric: tabular-nums; }
  #timer.paused #timer-clock { opacity: 0.35; }
  #timer.paused #timer-label::after { content: " — paused"; opacity: 0.5; }
  /* Held is not paused. It has never run, so "paused" would be a lie and
     the clock underneath is a promise rather than a position. */
  #timer.held #timer-clock { opacity: 0.3; }
  #timer.held #timer-label::after { content: " — waiting for you";
                                    opacity: 0.5; }
  #timer.held #timer-round { color: #8fa6c4; opacity: 0.95;
                             letter-spacing: 0.02em; }
</style>
</head>
<body class="state-idle">

  <div id="ambient">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="greeting"></div>
  </div>

  <div id="convo">
    <div id="heard"></div>
    <div id="reply"></div>
    <!-- Sources appear only when the model actually cited something. The
         spoken reply never reads a URL aloud, so this is where that half of
         the answer lives. -->
    <div id="sources"></div>
  </div>


  <div id="board">
    <div id="board-head">
      <div id="board-title">Boards</div>
      <div id="board-stats"></div>
      <div id="board-clock"></div>
    </div>
    <div id="board-cols"></div>
    <div id="board-foot"></div>
  </div>

  <div id="case">
    <div id="case-head">
      <div id="case-title">Case</div>
      <div class="chip" id="case-ref" hidden></div>
      <div class="chip sev" id="case-sev" hidden></div>
      <div id="case-spacer"></div>
      <div id="case-prog"></div>
      <div id="case-clock">--:--<small>sla</small></div>
    </div>
    <div id="case-cols"></div>
    <div id="case-foot"><span id="case-said"></span></div>
  </div>

  <div id="timer">
    <div id="timer-name"></div>
    <div id="timer-label">Work</div>
    <div id="timer-clock">0:00</div>
    <div id="timer-round"></div>
    <div id="timer-bar"><div id="timer-fill"></div></div>
    <div id="timer-left"></div>
  </div>

  <div id="check">
    <div id="check-head">
      <div id="check-title">Systems check</div>
      <div class="chip" id="check-verdict"></div>
      <div id="check-spacer"></div>
      <div id="check-when"></div>
    </div>
    <div id="check-groups"></div>
    <div id="check-foot"><span id="check-summary"></span></div>
  </div>

  <input id="typed" placeholder="Type a question, Enter to send, Esc to dismiss"
         autocomplete="off" spellcheck="false">

  <div id="wall">
    <div id="wall-line">
      <span id="wall-dot"></span><span id="wall-word">checking…</span>
      <span id="wall-groups"></span>
      <span id="wall-age"></span>
    </div>
    <div id="wall-bad"></div>
  </div>

  <div id="pill">
    <span id="pill-dot"></span><span id="pill-text">Starting…</span>
  </div>

  <div id="bar">
    <div id="dot"></div>
    <div id="status">Starting…</div>
    <div id="meta"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  let name = "Assistant", idleTimer = null, ws = null, backoff = 500;

  const LABELS = {
    idle:         "Ready",
    listening:    "Listening…",
    transcribing: "Got it…",
    thinking:     "Thinking…",
    speaking:     "Speaking",
    error:        "Something went wrong",
    offline:      "Orchestrator offline",
  };

  // ---------- clock ----------
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], {
      hour: "numeric", minute: "2-digit"
    });
    $("date").textContent = d.toLocaleDateString([], {
      weekday: "long", month: "long", day: "numeric"
    });
  }
  tick();
  setInterval(tick, 1000);

  // ---------- views ----------
  function showAmbient() {
    $("ambient").style.display = "flex";
    $("convo").style.display = "none";
  }
  function showConvo() {
    clearTimeout(idleTimer);
    $("ambient").style.display = "none";
    $("convo").style.display = "flex";
  }
  function scheduleIdle(ms = 45000) {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showAmbient, ms);
  }

  function setState(state, detail) {
    // Remove ONLY the state-* class. Assigning body.className wholesale
    // destroys every other class on the element, which is a bug that keeps
    // coming back wearing different clothes: first it ate hide-cursor, and
    // then it silently ate board-on — showBoard() added the class, the
    // websocket connected, the server sent its opening "idle" state, and the
    // fully-rendered board vanished behind display:none a moment later.
    // Preserving one class by name fixes one symptom; this fixes the cause.
    Array.from(body.classList)
      .filter((c) => c.startsWith("state-"))
      .forEach((c) => body.classList.remove(c));
    body.classList.add("state-" + state);
    const label = LABELS[state] || state;
    const working = ["listening", "transcribing", "thinking"].includes(state);
    $("status").textContent = label;
    $("status").classList.toggle("pulse", working);
    // The pill says the same thing, above every panel. Same label, same
    // rule about when to pulse — one source of truth for both, so they
    // cannot disagree about what she is doing.
    $("pill-text").textContent = label;
    $("pill-dot").classList.toggle("pulse", working);
    $("meta").textContent = detail ? detail + " tier" : "";
    if (state === "idle") scheduleIdle();
  }

  // ---------- socket ----------
  // Sources are built with textContent, never innerHTML. The titles come
  // from web pages the model chose, which makes them untrusted input, and a
  // kiosk browser is the last place you want to render someone else's markup.
  function renderSources(list) {
    const box = $("sources");
    box.textContent = "";
    if (!list || !list.length) return;
    const label = document.createElement("span");
    label.className = "src-label";
    label.textContent = list.length === 1 ? "Source" : "Sources";
    box.appendChild(label);
    list.slice(0, 5).forEach(s => {
      const item = document.createElement("span");
      item.className = "src";
      let host = s.url;
      try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch (e) {}
      item.textContent = host;
      item.title = s.title || s.url;
      box.appendChild(item);
    });
  }


  // ---------- board ----------
  // Two modes from one file: /dashboard pins it on permanently, and a voice
  // request shows it for a while over the conversation view. Sharing the
  // renderer means there is only ever one thing to keep correct.
  // The appliance points at /dashboard. That used to mean "pin the board on
  // forever"; it now means "this screen has a resting state", and the
  // resting state is the status wall. There is no keyboard on that machine,
  // so the wall cannot live behind a shortcut — it has to be the default or
  // it is nothing. ?board= still pins the board the old way.
  const BOARD_HOME = location.pathname.startsWith("/dashboard");
  const BOARD_PINNED = new URLSearchParams(location.search).has("board");
  const BOARD_SECONDS = 90;
  let boardTimer = null, boardPoll = null;

  async function loadBoard() {
    try {
      const r = await fetch("/board", { cache: "no-store" });
      renderBoard(await r.json());
    } catch (e) {
      // A failed refresh leaves the last good render up, which is the right
      // behaviour for a screen on a wall: stale beats blank.
    }
  }

  function renderBoard(d) {
    $("board-clock").textContent = new Date().toLocaleTimeString([], {
      hour: "numeric", minute: "2-digit" });
    const cols = $("board-cols");
    cols.textContent = "";

    const stats = $("board-stats");
    stats.textContent = "";
    [[d.open_total ?? 0, "open"], [d.done_today ?? 0, "done today"]]
      .forEach(([n, label]) => {
        const w = document.createElement("div"); w.className = "bstat";
        const b = document.createElement("b"); b.textContent = n;
        const s = document.createElement("span"); s.textContent = label;
        w.append(b, s); stats.appendChild(w);
      });

    if (d.reminders && d.reminders.length) {
      cols.appendChild(card("Reminders", d.reminders.map(r => ({
        text: r.text, sub: r.when })), true));
    }
    (d.lists || []).forEach(l => {
      const items = (l.items || []).map(t => ({ text: t }))
        .concat((l.done || []).map(t => ({ text: t, done: true })));
      cols.appendChild(card(l.title, items));
    });
    if (!cols.children.length) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Nothing on any board.";
      cols.appendChild(p);
    }

    const foot = $("board-foot");
    foot.textContent = "";
    [`${d.name} · ${d.audio_ok ? "listening" : "microphone offline"}`,
     `24h spend $${(d.spend_24h_usd ?? 0).toFixed(3)}`].forEach(t => {
      const s = document.createElement("span"); s.textContent = t;
      foot.appendChild(s);
    });
  }

  // Built with textContent throughout — list items are things people said
  // out loud and were transcribed, so they are untrusted text, and this
  // browser is running in kiosk mode with nobody watching it.
  function card(title, items, isRem) {
    const openCount = items.filter(i => !i.done).length;
    const el = document.createElement("div");
    el.className = "card" + (isRem ? " rem" : "")
                 + (openCount ? "" : " empty-board");
    const head = document.createElement("div");
    head.className = "card-head";
    const h = document.createElement("div");
    h.className = "card-title"; h.textContent = title;
    const c = document.createElement("div");
    c.className = "card-count"; c.textContent = openCount || "";
    head.append(h, c); el.appendChild(head);

    if (!items.length) {
      const p = document.createElement("div");
      p.className = "empty"; p.textContent = "clear";
      el.appendChild(p);
    } else {
      const ul = document.createElement("ul");
      items.forEach(it => {
        const li = document.createElement("li");
        if (it.done) li.className = "done";
        li.textContent = it.text;
        if (it.sub) {
          const w = document.createElement("span");
          w.className = "when"; w.textContent = it.sub;
          li.appendChild(w);
        }
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }
    return el;
  }

  function showBoard(seconds) {
    // The case overlay sits on top of the board, so it has to step aside
    // rather than the board quietly rendering underneath it. So does the
    // resting wall, which is a fixed panel above the board in the stack —
    // rendering the board underneath it would look like nothing happened.
    hideCase();
    $("check").classList.remove("on");
    wallStripOn(true);
    document.body.classList.add("board-on");
    loadBoard();
    clearInterval(boardPoll);
    boardPoll = setInterval(loadBoard, 15000);
    clearTimeout(boardTimer);
    if (!BOARD_PINNED && seconds) {
      boardTimer = setTimeout(hideBoard, seconds * 1000);
    }
  }

  function hideBoard() {
    if (BOARD_PINNED) return;
    document.body.classList.remove("board-on");
    clearInterval(boardPoll); boardPoll = null;
    clearTimeout(boardTimer); boardTimer = null;
    // Asking for the shopping list mid-investigation should not cost you the
    // checklist. The board has its ninety seconds and then the case comes
    // back, because the case is the thing with a deadline on it.
    if (caseData) showCase();
    else restIfIdle();
  }

  // NB: the pinned dashboard is started at the bottom of the case section,
  // not here. showBoard() now stands the case overlay down, and hideCase()
  // touches `casePoll`, which is declared below — calling it from up here
  // hits the temporal dead zone and the whole script dies on /dashboard.


  // ---------- case ----------
  // Unlike the board, this does NOT time out. An investigation checklist that
  // vanishes after ninety seconds is a checklist you have to keep asking for,
  // and asking for it is exactly the friction the whole feature exists to
  // remove. It goes up when a case opens and stays up until the case closes.
  let caseData = null, casePoll = null, caseTick = null, caseSkew = 0;
  let caseLastDone = -1;

  async function loadCase() {
    try {
      const r = await fetch("/case", { cache: "no-store" });
      const d = await r.json();
      if (!d.active) { endCase(); return; }
      // The server tells us its own clock. Counting down against an absolute
      // deadline using a browser clock that is a minute out would put the
      // wrong number on the wall, and this is the one number on this screen
      // somebody is actually relying on.
      if (d.now) caseSkew = d.now - Date.now() / 1000;
      caseData = d;
      renderCase(d);
      showCase();
    } catch (e) {
      // Keep the last good render. Stale beats blank on a wall display.
    }
  }

  function fmtLeft(secs) {
    const late = secs < 0;
    let s = Math.floor(Math.abs(secs));
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const pad = (n) => String(n).padStart(2, "0");
    const body = h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    return (late ? "+" : "") + body;
  }

  function paintClock() {
    if (!caseData) return;
    const el = $("case-clock");
    if (!caseData.sla_due) {
      // No deadline — a workout. Count UP instead. Session length is the
      // number you want mid-set; "no SLA" tells you nothing.
      const up = Date.now() / 1000 + caseSkew - caseData.opened;
      el.textContent = fmtLeft(Math.max(0, up));
      el.className = "";
      const lbl = document.createElement("small");
      lbl.textContent = "elapsed"; el.appendChild(lbl);
      return;
    }
    const now = Date.now() / 1000 + caseSkew;
    const left = caseData.sla_due - now;
    const span = Math.max(1, caseData.sla_due - caseData.opened);
    const gone = 1 - left / span;

    el.textContent = fmtLeft(left);
    el.className = left < 0 ? "late" : (gone >= 0.75 ? "warn" : "");
    const lbl = document.createElement("small");
    lbl.textContent = left < 0 ? "sla breached" : "sla remaining";
    el.appendChild(lbl);
  }

  function renderCase(d) {
    $("case-title").textContent = d.title || "Case";
    const ref = $("case-ref");
    ref.hidden = !d.ref; ref.textContent = d.ref || "";
    const sev = $("case-sev");
    sev.hidden = !d.severity; sev.textContent = d.severity || "";
    $("case-prog").textContent = `${d.done_total}/${d.step_total}`;
    paintClock();

    const cols = $("case-cols");
    cols.textContent = "";
    // The server says which columns exist. A workout has one; an
    // investigation has two. Hard-coding the pair here is what would put an
    // empty "My tasks" panel next to your bench press.
    const spec = d.columns
      || [{key: "investigation", label: "Investigation"},
          {key: "admin", label: "My tasks"}];
    cols.style.gridTemplateColumns =
      spec.length === 1 ? "minmax(0, 46rem)" : "repeat(" + spec.length + ", 1fr)";
    cols.style.justifyContent = spec.length === 1 ? "center" : "stretch";
    cols.classList.toggle("solo", spec.length === 1);
    spec.forEach((c) => {
      cols.appendChild(caseColumn(c.label, (d.sides || {})[c.key] || []));
    });

    // Keep the step you are on in view. Only when something was actually
    // ticked — scrolling on every fifteen-second poll would yank the column
    // back under you while you were reading further down it.
    if (d.done_total !== caseLastDone) {
      caseLastDone = d.done_total;
      requestAnimationFrame(() => {
        cols.querySelectorAll(".step.next").forEach((el) =>
          el.scrollIntoView({ block: "center", behavior: "smooth" }));
      });
    }
  }

  // textContent throughout. Step text comes from a YAML file, but findings
  // are transcribed speech, and this browser runs in kiosk mode with nobody
  // watching it.
  function caseColumn(label, steps) {
    const done = steps.filter(s => s.done).length;
    const col = document.createElement("div");
    col.className = "case-col";

    const h = document.createElement("h2");
    h.textContent = label;
    const n = document.createElement("em");
    n.textContent = `${done}/${steps.length}`;
    h.appendChild(n);
    col.appendChild(h);

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = steps.length
      ? `${Math.round((done / steps.length) * 100)}%` : "0%";
    bar.appendChild(fill);
    col.appendChild(bar);

    const ul = document.createElement("ul");
    ul.className = "steps";
    // A column with one phase does not need a phase heading — it would just
    // restate the column title one line below itself.
    const multiPhase = new Set(steps.map(s => s.phase || "")).size > 1;
    let phase = null, markedNext = false;
    steps.forEach((s) => {
      if (multiPhase && s.phase && s.phase !== phase) {
        phase = s.phase;
        const p = document.createElement("li");
        p.className = "phase"; p.textContent = phase;
        ul.appendChild(p);
      }
      const li = document.createElement("li");
      li.className = "step" + (s.done ? " done" : "");
      if (!s.done && !markedNext) { li.classList.add("next"); markedNext = true; }

      const box = document.createElement("span");
      box.className = "box"; box.textContent = s.done ? "✓" : "○";
      const txt = document.createElement("span");
      txt.className = "txt";
      const label = document.createElement("span");
      label.className = "label"; label.textContent = s.text;
      txt.appendChild(label);
      if (s.finding) {
        const f = document.createElement("span");
        f.className = "found"; f.textContent = s.finding;
        txt.appendChild(f);
      }
      li.append(box, txt);
      ul.appendChild(li);
    });
    if (!steps.length) {
      const p = document.createElement("li");
      p.className = "phase"; p.textContent = "nothing here";
      ul.appendChild(p);
    }
    col.appendChild(ul);
    return col;
  }

  // ---------- interval timer ---------------------------------------
  // Driven entirely by the orchestrator: one message a second carrying where
  // the session is. Nothing counts down in here, because a browser tab that
  // has been throttled in the background would drift away from the voice
  // calling the rounds — and the voice is the part you are listening to.
  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  // Which session is on screen, and whether he has asked for something else
  // to be in front of it. Both are needed because the orchestrator redraws
  // the timer once a second: without them, pressing "b" during an AMRAP put
  // the board up for well under a second before the next draw took the
  // screen straight back, which looked exactly like the key doing nothing.
  let timerSession = null;
  let timerAside = false;
  let timerLast = null;

  function paintTimer() {
    const box = $("timer"), m = timerLast;
    if (!m || !m.running) { box.className = ""; return; }
    if (timerAside) { box.className = ""; return; }
    box.className = "on " + (m.kind || "work")
      + (m.held ? " held" : (m.paused ? " paused" : ""));
    // The last five seconds go red. By then you are not reading words.
    // A held timer is never urgent: its clock is not running down.
    if (m.remaining <= 5 && m.kind !== "ready" && !m.held) {
      box.classList.add("urgent");
    }
  }

  function renderTimer(m) {
    const box = $("timer");
    if (!m.running) {
      timerLast = null; timerSession = null; timerAside = false;
      box.className = "";
      // Give the screen back to whatever was underneath. On the pinned
      // dashboard that is the board, which never left.
      if (caseData && !BOARD_PINNED) showCase();
      else restIfIdle();
      return;
    }

    // A NEW session takes the screen; a redraw of the one already up does
    // not. This is the whole fix: "take the screen" is an event, not a
    // property of every frame.
    if (m.session !== timerSession) {
      timerSession = m.session;
      timerAside = false;
      hideBoard();
      hideCheck();
    }

    // Always keep the contents current, even while it is out of the way, so
    // bringing it back shows the real clock rather than a stale one.
    timerLast = m;
    $("timer-name").textContent = m.name || "";
    $("timer-label").textContent = m.label || "";
    $("timer-clock").textContent = mmss(m.remaining);
    // The round number is the wrong thing to show on a timer that has not
    // begun. Say what it is waiting for instead.
    $("timer-round").textContent = m.held
      ? 'say \u201cgo\u201d when you are ready'
      : (m.rounds > 1 && m.round ? `round ${m.round} of ${m.rounds}` : "");
    const pct = m.phase_seconds
      ? 100 * (1 - m.remaining / m.phase_seconds) : 0;
    $("timer-fill").style.width = Math.max(0, Math.min(100, pct)) + "%";
    $("timer-left").textContent =
      m.total ? mmss(m.left) + " left altogether" : "";
    paintTimer();
  }

  function timerRunning() { return timerLast !== null; }
  // ---------- the status wall --------------------------------------
  // Polled, not pushed. A wall that goes quietly stale because a websocket
  // died in the night is the exact failure it exists to catch; a dropped
  // poll shows up in the corner within ten seconds.
  const WALL_SECONDS = 5;
  const WALL_WORDS = { ok: "All well", warn: "Needs a look",
                       fail: "Something is wrong", skip: "Starting up" };
  let wallOkAt = 0;

  function wallAgo(s) {
    if (s === null || s === undefined) return "never";
    if (s < 60) return Math.round(s) + "s";
    if (s < 3600) return Math.round(s / 60) + "m";
    return (s / 3600).toFixed(1) + "h";
  }

  let stripWanted = true;
  // Declared here, with the poller that sets it, rather than down beside the
  // panel it controls: loadWall() runs the moment this script is evaluated.
  let RESTING = false;

  function renderWall(d) {
    const box = $("wall");
    box.className = (stripWanted ? "on " : "") + d.verdict;
    $("wall-word").textContent = WALL_WORDS[d.verdict] || d.verdict;

    // One dot per group: six of them say more at a glance than twenty-six
    // rows, and the rows are on /status for when you want them.
    const worst = {};
    d.checks.forEach(c => {
      const rank = { ok: 0, skip: 1, warn: 2, fail: 3 };
      if (!(c.group in worst) || rank[c.status] > rank[worst[c.group]]) {
        worst[c.group] = c.status;
      }
    });
    const groups = $("wall-groups");
    groups.textContent = "";
    d.groups.forEach(g => {
      if (!(g in worst)) return;
      const el = document.createElement("span");
      el.className = "g " + worst[g];
      const i = document.createElement("i");
      const t = document.createElement("span");
      t.textContent = g.toLowerCase();
      el.append(i, t);
      groups.appendChild(el);
    });

    const bad = $("wall-bad");
    bad.textContent = "";
    d.problems.slice(0, 4).forEach(p => {
      const row = document.createElement("div");
      row.className = "b";
      const n = document.createElement("span"); n.className = "n";
      n.textContent = p.name;
      const dd = document.createElement("span"); dd.className = "d";
      dd.textContent = p.detail || "";
      row.append(n, dd);
      if (p.fix) {
        const f = document.createElement("span"); f.className = "f";
        f.textContent = p.fix;
        row.appendChild(f);
      }
      bad.appendChild(row);
    });
    if (d.problems.length > 4) {
      const more = document.createElement("div");
      more.className = "b";
      more.textContent = `and ${d.problems.length - 4} more — see /status`;
      bad.appendChild(more);
    }
  }

  async function loadWall() {
    try {
      const r = await fetch("/status.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      renderWall(d);
      // One fetch drives both surfaces. Two pollers on the same endpoint
      // would eventually disagree with each other, and a status display
      // that contradicts itself is worse than one that is merely late.
      RESTING = !!d.resting && BOARD_HOME;
      if (RESTING && !boardOn() && !caseOn() && !timerOn()) {
        renderCheck(d, true);
        wallStripOn(false);
      } else {
        wallStripOn(true);
      }
      wallOkAt = Date.now();
      $("wall-age").textContent = "";
      $("wall-age").classList.remove("stale");
    } catch (err) {
      // Keep the last known state on screen. Blanking it would hide the
      // very thing that just went wrong.
      const secs = wallOkAt ? Math.round((Date.now() - wallOkAt) / 1000) : 0;
      $("wall-age").textContent = wallOkAt
        ? `no answer for ${secs}s` : "orchestrator not answering";
      $("wall-age").classList.add("stale");
      wallStripOn(true);
      if (!wallOkAt) {
        $("wall").className = "on fail";
        $("wall-word").textContent = "Orchestrator not answering";
      }
    }
  }

  loadWall();
  setInterval(loadWall, WALL_SECONDS * 1000);

  function timerOn() { return $("timer").classList.contains("on"); }

  // Step the clock aside for another panel. The timer itself is untouched —
  // it keeps running, keeps counting him down out loud, and comes back on
  // the next session or the moment he asks for it.
  function timerAsideSet(aside) {
    if (!timerRunning()) return;
    timerAside = !!aside;
    paintTimer();
  }

  function toggleTimer() {
    if (!timerRunning()) return;
    timerAsideSet(!timerAside);
    if (!timerAside) { hideCheck(); }
  }

  // ---------- systems check ----------------------------------------
  // Grouped, colour-coded, and showing the FIX for anything that is wrong.
  // A screen that says "printer: failed" and stops has turned a known problem
  // into a mystery; the whole point is that you can act from across the room.
  let checkTimer = null;
  const CHECK_SECONDS = 90;

  function renderCheck(report, resting) {
    const wrap = $("check-groups");
    wrap.textContent = "";
    const order = ["Hardware", "Services", "Access", "Models",
                   "Storage", "State"];
    const byGroup = {};
    (report.checks || []).forEach(c => {
      (byGroup[c.group] = byGroup[c.group] || []).push(c);
    });

    order.forEach(name => {
      const rows = byGroup[name];
      if (!rows || !rows.length) return;
      const box = document.createElement("div");
      box.className = "cgroup";
      const h = document.createElement("h3");
      h.textContent = name;
      box.appendChild(h);
      rows.forEach(c => {
        const row = document.createElement("div");
        row.className = "crow " + c.status;
        const dot = document.createElement("span");
        dot.className = "dot";
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = c.name;
        const dt = document.createElement("span");
        dt.className = "dt";
        dt.textContent = c.detail || "";
        row.append(dot, nm, dt);
        box.appendChild(row);
        // The fix only for things that are wrong. Printing advice under
        // twenty passing checks buries the two that need you.
        if ((c.status === "fail" || c.status === "warn") && c.fix) {
          const fix = document.createElement("div");
          fix.className = "cfix";
          fix.textContent = c.fix;
          box.appendChild(fix);
        }
      });
      wrap.appendChild(box);
    });

    const counts = report.counts || {};
    const verdict = $("check-verdict");
    if (counts.fail) {
      verdict.textContent = counts.fail + " failed";
      verdict.className = "chip fail";
    } else if (counts.warn) {
      verdict.textContent = counts.warn + " warning" +
                            (counts.warn === 1 ? "" : "s");
      verdict.className = "chip warn";
    } else {
      verdict.textContent = "all clear";
      verdict.className = "chip ok";
    }
    $("check-when").textContent = report.at
      ? new Date(report.at * 1000).toLocaleString([], {
          weekday: "short", hour: "2-digit", minute: "2-digit" })
      : "";
    $("check-summary").textContent = resting
      ? `${counts.ok || 0} passing · re-read continuously · ` +
        `full detail at /status`
      : `${counts.ok || 0} passed, ${counts.skip || 0} not applicable, ` +
        `checked in ${report.seconds || 0} seconds`;

    $("check-title").textContent = resting ? "Status" : "Systems check";
    $("check").classList.add("on");
    $("check").classList.toggle("resting", !!resting);
    // Resting is the screen's home, so it has no timeout — it is what the
    // appliance shows when nothing else needs the monitor. A one-off report
    // still stands down on its own: it is something you walked over to read,
    // not something to leave up all night. Anything failing holds it twice
    // as long, because that is the one you came to look at.
    clearTimeout(checkTimer);
    checkTimer = null;
    if (!resting) {
      hideBoard();
      const secs = counts.fail ? CHECK_SECONDS * 2 : CHECK_SECONDS;
      checkTimer = setTimeout(hideCheck, secs * 1000);
    }
  }

  // ---------- the resting wall --------------------------------------
  // There is no keyboard on the appliance, so the full grid cannot live
  // behind a shortcut. It is the screen's resting state instead: what you
  // see whenever nothing else has asked for the monitor. Everything that
  // does ask — the board, a case, a timer, a video — covers it and hands it
  // back when it is done.
  function boardOn() { return document.body.classList.contains("board-on"); }

  // The strip and the full grid say the same thing, so only one of them
  // should ever be on screen.
  function wallStripOn(on) {
    stripWanted = !!on;
    $("wall").classList.toggle("on", stripWanted);
  }

  // Give the screen back to the wall once whatever borrowed it is finished.
  function restIfIdle() {
    if (RESTING && !boardOn() && !caseOn() && !timerOn()) loadWall();
  }

  async function loadCheck() {
    // Shows the LAST report. Deliberately never runs a fresh one: a real run
    // makes a paid API call and a web search, and a keyboard shortcut that
    // quietly spends money whenever somebody leans on the keyboard is a bad
    // shortcut. Ask her out loud to run one.
    try {
      const r = await fetch("/selfcheck");
      const data = await r.json();
      if (data.ran === false) {
        $("check-groups").textContent = "";
        $("check-verdict").textContent = "not run yet";
        $("check-verdict").className = "chip";
        $("check-when").textContent = "";
        $("check-summary").textContent =
          'Say "run a self check" to have her look.';
        $("check").classList.add("on");
        clearTimeout(checkTimer);
        checkTimer = setTimeout(hideCheck, 20000);
        return;
      }
      renderCheck(data);
    } catch (err) {
      console.warn("could not load the self check", err);
    }
  }

  function hideCheck() {
    clearTimeout(checkTimer);
    checkTimer = null;
    // Refusing to hide the resting wall is the point of the flag: there is
    // nothing behind it to reveal, and an appliance showing a blank screen
    // is indistinguishable from one that has died.
    // Keyed on the class alone, not on the RESTING flag as well. The class
    // is set by the same call that decided this panel is the resting view,
    // so it is the honest test; the flag is about whether this SCREEN has a
    // resting state at all, and the two drift apart on a page that has not
    // reached the orchestrator yet.
    if ($("check").classList.contains("resting")) return;
    $("check").classList.remove("on");
    restIfIdle();
  }

  function checkOn() { return $("check").classList.contains("on"); }

  function showCase() {
    document.body.classList.add("case-on");
    // Tear the board down directly rather than through hideBoard(), which
    // no-ops on the pinned dashboard. Leaving board-on set would be invisible
    // — the CSS puts the case on top either way — while quietly keeping a
    // /board poll running for the rest of the day.
    document.body.classList.remove("board-on");
    clearInterval(boardPoll); boardPoll = null;
    clearTimeout(boardTimer); boardTimer = null;
    clearInterval(casePoll);
    casePoll = setInterval(loadCase, 15000);
    // The countdown ticks locally every second. Polling alone would move it
    // in fifteen-second jumps, which looks like a frozen clock.
    clearInterval(caseTick);
    caseTick = setInterval(paintClock, 1000);
  }

  function hideCase() {
    document.body.classList.remove("case-on");
    clearInterval(casePoll); casePoll = null;
    clearInterval(caseTick); caseTick = null;
    restIfIdle();
  }

  // The case is over. Drop the data as well as the classes, or hideBoard()
  // will helpfully resurrect a checklist for a finished investigation. On the
  // pinned dashboard the boards come back, which is where that screen lives
  // when nothing is being investigated.
  function endCase() {
    caseData = null;
    caseLastDone = -1;
    hideCase();
    if (BOARD_PINNED) showBoard();
  }

  function caseOn() { return document.body.classList.contains("case-on"); }

  if (BOARD_PINNED) showBoard();

  // Come back up mid-investigation — after a reboot, an update, the USB
  // wedge — and the checklist is already on screen. The case outlived the
  // process, so the display should too. This runs after showBoard() so an
  // open case wins the screen on the dashboard as well.
  loadCase();

  // B toggles the board; C the case; Escape dismisses whichever is up.

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws/display`);

    ws.onopen = () => { backoff = 500; };

    ws.onmessage = (ev) => {
      let m;
      try {
        m = JSON.parse(ev.data);
      } catch (err) {
        console.warn("dropped a malformed frame", err);
        return;
      }
      switch (m.type) {
        case "hello":
          name = m.name;
          $("greeting").textContent = `Say “${name}” to begin`;
          break;
        case "state":
          setState(m.state, m.detail);
          break;
        case "show_board":
          // Asking for another screen is asking the clock to step aside.
          timerAsideSet(true);
          showBoard(BOARD_SECONDS);
          break;
        case "show_case":
          timerAsideSet(true);
          loadCase();
          break;
        case "hide_case":
          endCase();
          break;
        case "sla":
          // Warnings land in the footer strip rather than taking the screen.
          // The countdown is already the largest thing on it; a modal would
          // hide the checklist at the exact moment it matters most.
          $("case-said").textContent = m.text;
          break;
        case "transcript":
          hideBoard();
          hideCheck();
          // The timer stays. Asking "how long left" must not take the clock
          // off the screen to show you the words you just said.
          if (timerOn()) break;
          // Mid-investigation the checklist stays put and the conversation
          // shrinks to one line at the bottom. Swapping a 28-step checklist
          // out for one sentence, every time you speak, is how a screen
          // becomes something you stop looking at.
          if (caseOn()) { $("case-said").textContent = m.text; break; }
          showConvo();
          $("heard").textContent = m.text;
          $("reply").textContent = "";
          $("sources").textContent = "";
          break;
        case "response_delta":
          showConvo();
          $("reply").textContent += m.text;
          $("reply").scrollTop = $("reply").scrollHeight;
          break;
        case "response_done":
          if (m.error) setState("error");
          renderSources(m.sources);
          // The reply accumulated into #reply as usual — it is just hidden
          // under the checklist. Surface the finished sentence in the strip
          // so there is still a record of what was said back.
          if (caseOn()) $("case-said").textContent = $("reply").textContent;
          scheduleIdle();
          break;
        case "interval":
          renderTimer(m);
          break;
        case "interval_view":
          // "Show the timer" / "put the clock away", said out loud. A
          // one-shot instruction, never a field on the per-second draw —
          // that would overrule the keyboard within a second.
          timerAsideSet(!m.show);
          if (m.show) { hideCheck(); }
          break;
        case "selfcheck":
          timerAsideSet(true);
          renderCheck(m);
          break;
        case "barge_in":
          $("reply").textContent = "";
          break;
        case "reminder":
          // This case was missing entirely, so a fired timer was spoken and
          // never drawn. On the ambient screen the alarm went off and the
          // display said nothing at all.
          showConvo();
          $("heard").textContent = m.kind === "timer" ? "Timer" : "Reminder";
          $("reply").textContent = m.text || "";
          scheduleIdle();
          break;
        default:
          // Anything unhandled used to vanish silently, which is exactly how
          // the missing `reminder` case went unnoticed.
          console.warn("unhandled display message:", m.type, m);
      }
    };

    ws.onclose = () => {
      setState("offline");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }
  connect();

  // ---------- cursor auto-hide ----------
  let cursorTimer = null;
  function nudgeCursor() {
    body.classList.remove("hide-cursor");
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => body.classList.add("hide-cursor"), 3000);
  }
  document.addEventListener("mousemove", nudgeCursor);
  nudgeCursor();

  // ---------- typed fallback ----------
  // Works before the voice pipeline exists, and stays useful afterwards for
  // anything awkward to say out loud.
  const input = $("typed");
  document.addEventListener("keydown", (e) => {
    if (document.activeElement === input) {
      if (e.key === "Escape") { input.value = ""; input.blur();
                                input.style.display = "none"; }
      if (e.key === "Enter" && input.value.trim() && ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "text_input", text: input.value.trim() }));
        input.value = ""; input.blur(); input.style.display = "none";
      }
      return;
    }
    // Shortcuts. These used to live in a SECOND keydown listener that never
    // checked whether the text box had focus — so pressing "b" toggled the
    // board *and* opened the input pre-filled with "b", and typing the letter
    // c into the input swapped the case overlay out from under you. One
    // listener, input wins, every branch returns.
    if (e.key === "b" || e.key === "B") {
      timerAsideSet(true);
      document.body.classList.contains("board-on")
        ? hideBoard() : showBoard(BOARD_SECONDS);
      return;
    }
    if (e.key === "c" || e.key === "C") {
      timerAsideSet(true);
      caseOn() ? hideCase() : loadCase();
      return;
    }
    if (e.key === "d" || e.key === "D") {
      timerAsideSet(true);
      checkOn() ? hideCheck() : loadCheck();
      return;
    }
    if (e.key === "t" || e.key === "T") {
      toggleTimer();
      return;
    }
    if (e.key === "Escape") {
      hideBoard(); hideCase(); hideCheck();
      // The screen only. The timer runs on, and t brings it back.
      timerAsideSet(true);
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      input.style.display = "block";
      nudgeCursor();
      input.value = e.key;
      input.focus();
      e.preventDefault();
    }
  });
  // A handle for the devtools console, and for rendering a panel from a
  // saved report without waiting for a real one. Everything above is inside
  // an IIFE, which is right — but it also means there is no way to poke at
  // the screen when something looks wrong on the appliance itself.
  window.lance = { renderCheck, hideCheck, loadCheck, showBoard, hideBoard,
                   restIfIdle, wallStripOn,
                   loadCase, hideCase, setState, renderTimer, toggleTimer,
                   timerAsideSet, timerOn, loadWall, renderWall,
                   get timerAside() { return timerAside; } };
})();
</script>
</body>
</html>
