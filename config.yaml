# ============================================================
# Home AI Appliance — configuration
# Everything you are likely to tune lives here.
# ============================================================

identity:
  # What the assistant calls itself. Used in the system prompt.
  name: "Lance"
  # The user's name, so it can address you.
  user: "Brendan"

server:
  host: "127.0.0.1"
  port: 8760

provider:
  # Which backend to use. Only "anthropic" is implemented in this
  # scaffold; the adapter layer in core/provider.py is where you would
  # add "openai" or "google" without touching anything else.
  name: "anthropic"

  models:
    small: "claude-haiku-4-5"     # timers, conversions, quick lookups
    mid:   "claude-sonnet-5"      # the workhorse — default
    top:   "claude-opus-5"        # long documents, careful reasoning

  # Hard ceiling per reply. Spoken answers should be short; this is a
  # backstop against a runaway generation, not a style control.
  max_tokens: 1024

  # Anthropic prompt caching. Caches the system prompt + tool schemas,
  # which are identical on every request and are most of your input
  # tokens. Cuts input cost by roughly 90% on the cached portion.
  prompt_caching: true

tools:
  web_search:
    # Anthropic runs the search server-side and hands the model the results.
    # You write no integration and maintain no API key for it.
    enabled: true
    # Searches per reply. Three is enough for "what's the weather and will it
    # rain tomorrow"; more mostly buys latency.
    max_uses: 2
    # Which model tiers carry the tool. NOT the small tier: server tools need
    # a recent model, and a tier that cannot search would fail rather than
    # answer. The router pushes anything that smells like a live-information
    # question up to mid for exactly this reason.
    tiers: ["mid", "top"]
    # Optional. Use one or the other, never both.
    # blocked_domains: ["pinterest.com"]
    # allowed_domains: []

reminders:
  # Timers and reminders — the only thing here that speaks without being
  # spoken to first. Stored in SQLite with absolute timestamps, so a restart,
  # an update, or a crash costs you nothing: pending items reload and fire.
  #
  # The MODEL does the date arithmetic. It is told the current time in every
  # request, so "in twenty minutes" and "tomorrow at seven" resolve upstream.
  # That keeps daylight-saving bugs out of the appliance entirely.
  #
  #   curl -s localhost:8760/reminders | jq
  enabled: true
  max_pending: 50

desktop:
  # Window management, as a fixed vocabulary of verbs — never a shell.
  #
  # Every input here arrives through a wake word that occasionally misfires
  # and a transcriber that occasionally mishears. `xdotool type` can drive
  # any application including a terminal, so there is deliberately no tool
  # for typing, clicking, closing windows, or running commands. What is here
  # is what can be undone by saying the opposite.
  #
  # X11 only. Wayland stops one application moving another's windows on
  # purpose; the tools say so rather than failing obscurely.
  #   sudo apt install -y wmctrl xdotool
  enabled: true
  # Windows the assistant will refuse to minimise — its own display, so that
  # "minimise everything" cannot blank the screen you watch it on.
  protect: ["assistant", "lance"]
  # ALSA card for volume. The assistant plays through the array, so the
  # system default sink is the wrong device.
  volume_card: "Array"
  display: ":0"

lists:
  # Named lists. Add, remove, read, clear, and ask what is on all of them.
  #   curl -s localhost:8760/lists | jq
  #   curl -s localhost:8760/lists/work | jq
  enabled: true
  # Used when no list is named. "Add milk" should not need qualifying.
  default: "shopping"
  # Add a new list by adding it here. `say` is how the assistant refers to it
  # out loud; `aliases` are the other things a person might actually SAY for
  # it. Speech does not arrive with a dropdown attached — "put it on the
  # honey-do list" and "add it to the house list" have to reach the same
  # place, and the only way that happens is if you write both down.
  #
  # Getting this wrong fails SILENTLY: the item lands on a list nobody reads,
  # which is the same as losing it. So be generous with aliases.
  known:
    shopping:
      say: "shopping list"
      aliases: ["groceries", "grocery", "store", "supermarket", "food"]
    work:
      say: "work board"
      aliases: ["office", "job", "work todo", "work to do", "day job"]
    projects:
      say: "projects board"
      aliases: ["project", "builds", "build", "workshop", "garage"]
    personal:
      say: "personal board"
      aliases: ["health", "money", "my own", "own list", "admin"]
    army:
      say: "army board"
      aliases: ["military", "guard", "unit", "drill", "training", "readiness"]
    house:
      say: "house board"
      aliases: ["home", "honey do", "honey-do", "chores", "around the house",
                "household", "yard", "garden"]
    kids:
      say: "kids board"
      aliases: ["children", "kid", "school", "family"]
  # Allow creating a list that is not named above, when one is clearly asked
  # for — "start a packing list". Set false to restrict to the list above.
  allow_new: true

memory:
  # Durable facts, remembered across restarts and across months.
  #
  # These are injected into EVERY request, which is what makes them work and
  # also what makes them expensive if abused: a wrong fact costs you on every
  # exchange until removed. The system prompt tells the model to be strict
  # about what earns a place here.
  #
  # Inspect or edit them directly whenever you like — it is just SQLite:
  #   sqlite3 ~/assistant/data/assistant.db "SELECT id,category,text FROM memories;"
  #   sqlite3 ~/assistant/data/assistant.db "DELETE FROM memories WHERE id=7;"
  # or over HTTP:  curl -s localhost:8760/memories | jq
  enabled: true
  # Refuse to store more than this. Roughly 200 short facts is a few thousand
  # tokens on every request — noticeable but not painful. Past that you want
  # retrieval, not injection.
  max_facts: 200

  # Memories age. A fact that WAS true is the dangerous kind: it embeds
  # perfectly, retrieves at the top, and gets stated with total confidence
  # long after it stopped being so. Nothing in a conversation ever says
  # "by the way, that is out of date now", so nothing event-driven can catch
  # it. This is the clock that does.
  sweep:
    enabled: true

    # Once a day is plenty. The check itself is two SQL queries over a few
    # dozen rows — no model call, no network — so the cost is not the reason
    # for the interval; nagging is.
    every_hours: 24

    # Belief below this gets flagged. ONE number, used by both the sweep and
    # the prompt block: two subsystems with two definitions of "stale" will
    # contradict each other in front of you. 0.35 is about a
    # half-life-and-a-half, which is late enough to mean something.
    fresh_floor: 0.35

  # Freeze the clock to demonstrate decay without waiting for it. An ISO date
  # here makes every ageing calculation pretend it is that day. Leave empty
  # for normal running — this is a debugging switch, not a setting.
  clock_at: ""

  # Semantic recall. The keyword search is kept — this runs alongside it.
  #
  # Keyword finds "INC-4412" and surnames. Meaning finds "the roof" in a
  # sentence about shingles. Neither replaces the other, so both vote and the
  # rankings are merged.
  semantic:
    enabled: true

    # 69 MB, 384 dimensions, runs on ONNX Runtime — already a dependency here
    # for the wake word. Changing this model invalidates every stored vector
    # and triggers an automatic re-index; that is handled, but it costs an
    # hour of background work, so do not change it casually.
    model: "BAAI/bge-small-en-v1.5"
    cache_dir: "~/assistant/models/embed"

    # Capped so embedding never competes with transcription. Whisper wants the
    # cores while someone is mid-sentence; an embedding that takes 40 ms
    # instead of 25 ms is invisible, a stuttering transcription is not.
    threads: 2

    # Background indexing. Small batches with a gap, then a long sleep once
    # there is nothing left to do.
    backfill_batch: 32
    backfill_gap_seconds: 2.0
    backfill_idle_seconds: 300.0

documents:
  # Plain text notes, written by the assistant on request. The Linux
  # equivalent of "save this in Notepad".
  enabled: true
  # Everything is confined to this one directory, checked on every write
  # after symlinks are resolved. Filenames are generated from a slugified
  # title, never taken from the model, so a title cannot contain a path.
  path: "~/Documents/Assistant"
  # txt opens in Text Editor with no ceremony. Use md if you would rather
  # have headings and lists render somewhere later.
  format: "txt"
  # Refuse anything longer. A runaway generation should not fill the disk.
  max_chars: 20000

casework:
  # OFF. The phishing investigation feature was removed — it lives on the
  # work machine now.
  #
  # The block stays, and core/casework.py stays with it, because WORKOUTS ARE
  # BUILT ON THIS MACHINERY. A training session is a row in `cases`, the
  # checklist on the monitor is the case overlay, and "that's the dips" is
  # ticked off by the case step matcher. None of that is gated on the flag
  # below — only the ten case TOOLS and the SLA clock are.
  #
  # Set this back to true and rename playbooks/phishing.yaml.disabled to get
  # the whole thing back, exactly as it was.
  enabled: false
  playbook_dir: "~/assistant/playbooks"

printer:
  # MUNBYN ITPP047. It reports itself as a Seiko Epson TM-m30-II, which is
  # whose ESC/POS dialect it speaks.
  enabled: true

  # A workout sheet with a dotted line under every exercise is one you can
  # write on with a pencil in the garage. Without them it is a third shorter
  # and better for a glance. Entirely a matter of taste, so: a setting.
  workout_write_lines: true

  # Measured on the device by printer_probe, not guessed. The IN endpoint is
  # 0x81 here; the usual guess is 0x82 and it would have failed as a silent
  # thirty-second timeout.
  vendor_id: "0x04b8"
  product_id: "0x0e20"
  out_ep: "0x01"
  in_ep: "0x81"

  # Characters per line at the default font. 42 is right for 80 mm paper.
  # If lists wrap in odd places, this is the number to change — set it to
  # whatever the printer's own self-test page reports.
  width: 42

  cut: true
  feed_lines: 3

  # Printed above the title, the way a shop name sits on a till receipt.
  # Set to "" for no masthead.
  header: "LANCE"

  # Give up rather than hang. A printer that is off, jammed, or out of paper
  # must not hold a worker thread while someone is waiting to be answered.
  timeout_ms: 5000



workouts:
  # Training sessions, run through the same checklist machinery as casework.
  #
  # A session is a FILE, not a playbook: drop a text file in the folder below
  # and say "start today's workout". With no name it takes the newest file,
  # which is also the answer to getting a workout in here without dictating it.
  #
  #     # Push Day A
  #     ## Main
  #     Bench press, 5 x 5 @ 185 | rest 180
  #     Dips, 3 x AMRAP
  #
  # "# " is the title, "## " a section, everything else an exercise. The
  # "| rest 180" tail is optional and falls back to the default below.
  enabled: true
  path: "~/assistant/workouts"

  # Used when a line does not specify its own rest.
  default_rest_seconds: 90

  # Logging a set starts the rest countdown automatically, so you never have
  # to say a second sentence with a bar in your hands. Set false if you would
  # rather ask for timers yourself.
  announce_rest: false


location:
  # Passed to the search tool so "near me", "tonight" and local business
  # hours resolve correctly. It is a hint for the search engine, not
  # tracking, and it never leaves the request. Set this to where the
  # appliance actually lives.
  city: "Gilbert"
  region: "Arizona"
  country: "US"
  timezone: "America/Phoenix"

router:
  # Requests shorter than this many characters with no complexity
  # markers go to the small tier.
  small_max_chars: 80
  # Saying any of these out loud forces the top tier.
  escalate_phrases:
    - "think hard"
    - "think carefully"
    - "take your time"
  # Questions that need looking up. These are usually SHORT, so without this
  # list they would fall through to the small tier — which does not carry the
  # search tool. Matching any of these forces the mid tier.
  live_info_markers:
    - "weather"
    - "forecast"
    - "temperature"
    - "rain"
    - "snow"
    - "news"
    - "headline"
    - "today"
    - "tonight"
    - "tomorrow"
    - "this week"
    - "right now"
    - "currently"
    - "latest"
    - "recent"
    - "current"
    - "price"
    - "cost of"
    - "stock"
    - "score"
    - "who won"
    - "open now"
    - "still open"
    - "hours"
    - "near me"
    - "traffic"
    - "look up"
    - "search"
  # Words that push a short request up to the mid tier anyway.
  # Words that name something this appliance can DO.
  #
  # These requests are short — "print my shopping list", "show the board",
  # "display full body A" — so the small_max_chars shortcut sends them to the
  # cheap model, which then has to choose the right one out of forty-odd
  # tools. It frequently does not.
  #
  # Found the hard way: "start today's workout" worked while "display full
  # body A workout" did not, and the only difference was that the first
  # contained "today" and got escalated by live_info_markers.
  #
  # Sonnet instead of Haiku on these costs a fraction of a cent and buys the
  # right tool being called.
  tool_markers:
    - "rounds"
    - "emom"
    - "amrap"
    - "tabata"
    - "interval"
    - "when i say"
    - "on my mark"
    - "wait for me"
    - "timer"
    - "countdown"
    - "on and"
    - "seconds off"
    - "seconds on"
    - "self check"
    - "self-check"
    - "diagnostic"
    - "health check"
    - "check yourself"
    - "test yourself"
    - "everything working"
    - "everything ok"
    - "play"
    - "put on"
    - "pull up"
    - "video"
    - "youtube"
    - "pause"
    - "resume"
    - "volume"
    - "mute"
    - "louder"
    - "quieter"
    - "skip"
    - "turn it up"
    - "turn it down"
    - "turn up"
    - "turn down"
    - "not that one"
    - "next one"
    - "workout"
    - "print my workout"
    - "on paper"
    - "print the session"
    - "exercise"
    - "session"
    - "lift"
    - "rest timer"
    - "checklist"
    - "print"
    - "board"
    - "list"
    - "note"
    - "remember"
    - "forget"
    - "recall"
    - "timer"
    - "remind"
    - "dashboard"
    - "screen"
    - "display"
    - "window"
    - "volume"
    - "memory"
    # Lift names, for asking about history when no session is open —
    # "what did I bench last time". While a session IS open the router
    # escalates everything anyway, so these only matter outside one.
    - "bench"
    - "squat"
    - "deadlift"
    - "press"
    - "curl"
    - "row"
    - "dip"
    - "pull-up"
    - "pullup"
    - "swing"
    - "carry"

  complexity_markers:
    - "why"
    - "explain"
    - "compare"
    - "draft"
    - "write"
    - "summarize"
    - "summarise"
    - "analyze"
    - "analyse"

context:
  # How many prior turns (user+assistant pairs) to send. Capping this is
  # what stops your input cost growing without bound over a long day.
  history_turns: 8
  # A gap longer than this starts a fresh conversation rather than continuing
  # the old one. Without it, coming back after three days makes the assistant
  # reply to something you said on Tuesday as though you had just said it.
  session_gap_minutes: 90
  # Characters of system prompt + persona. Kept small deliberately.
  system_prompt: |
    You are {name}, a voice assistant running on a dedicated appliance in
    {user}'s home. You are speaking out loud, so your replies are read by a
    text-to-speech engine.

    Keep answers short. Two or three sentences is usually right. If the
    answer is genuinely long, give the headline first and offer to go on.

    Never use markdown, bullet points, asterisks, or emoji — they are read
    aloud as noise. Write numbers and units the way a person would say
    them. Spell out anything that would be mangled if read literally.

    You are located in {place}. When {user} says "here", "nearby", or
    "tonight", that is what they mean.

    You can search the web, and you should whenever a question depends on
    current information — weather, news, prices, opening hours, sports,
    anything that changed after your training.

    When you are about to search, say one short sentence first — "Let me
    check." or "One second." — and then search. This matters more than it
    looks: a search takes several seconds, and everything you say is being
    read out loud, so that sentence is the only thing standing between {user}
    and silence. Say it before the search, never after.

    Never read a web address out loud, and do not say "according to" followed
    by a site name. The screen shows sources; your job is the answer. Give the
    figure or the fact, and say how fresh it is only when that matters — "as
    of this morning" for a price, nothing at all for a forecast.

    You can set timers and reminders. Work out the absolute time yourself
    from the timestamp in the message — "in twenty minutes", "at six", "next
    Tuesday morning" — and pass it as ISO 8601 local time. Use kind 'timer'
    for short countdowns and 'reminder' for anything tied to a clock time.
    Confirm briefly: "Set, in twenty minutes." Never read the timestamp back.

    You keep a shopping list and five task boards for {user}: house,
    projects, kids, work, personal, and army. Add items as they are
    mentioned, several at once when several are named.

    Choose from what was said. "We need milk" is shopping; "email the
    contractor" is work; "the gutters need clearing" is house; "finish the
    garage shelf" is projects; "book my physical" is personal; "drill
    weekend paperwork" is army. If it is genuinely ambiguous, ask which one —
    one short question — rather than guessing. An item filed on the wrong
    board is not wrong, it is lost, because nobody will ever look there.

    When {user} says they have done, finished, or handled something, tick it
    off with list_complete rather than removing it. Completed items stay
    visible on the board, which is how they can see what they got through.

    There are no due dates or priorities. If timing matters {user} puts it in
    the wording of the item itself, so keep their phrasing intact.

    When reading a list back, say it as a person would — "milk, eggs, bread
    and coffee" — never as a numbered list, and never read the list name back
    to them when they just told you what it was.

    You can arrange windows on the screen: list them, focus one, maximise,
    restore, fullscreen, minimise, snap to the left or right half, centre, and
    switch workspace. If it is unclear which window is meant, list them and
    ask rather than guessing.

    You cannot close windows, type, click, or run commands, and you should
    say so plainly if asked — those are not missing by accident.

    You can save notes and documents to {user}'s notes folder, and read them
    back. Use save_note whenever they ask you to write something down, take
    a note, draft something, or make a list — do it without asking permission
    first, since asking wastes a turn on something they already requested.

    What you WRITE and what you SAY are different. The note is read on a
    screen, so give it line breaks, headings and structure. Your spoken reply
    is just the confirmation: say what you called it and roughly how long it
    is, in one sentence. Never read a saved note back aloud unless asked.

    You remember things across conversations. Anything under "What you know
    about this household" was learned earlier and is still true unless {user}
    says otherwise.

    Use remember when {user} asks you to, and when they mention a stable fact
    about themselves, their household, or how they like things done. Write it
    as one self-contained sentence that will still make sense read cold in a
    year. Say that you have noted it, briefly, and move on — do not read the
    fact back verbatim.

    Be strict about what you store. Remembered facts go into every future
    conversation, so a wrong one is wrong forever, and a useless one costs
    something on every exchange. Do not store one-off task details, anything
    that will be untrue next week, passing moods, or anything sensitive like
    passwords, card numbers or medical specifics unless directly asked to.

    If {user} corrects something you remembered, forget the old fact and
    remember the new one. Do not leave both.

    Use recall to search past conversations when they refer to something from
    before that is not in what you already know.

    You can print on paper. Use print_list when {user} wants a list to take
    with him.

    Use print_workout for training. "Print my workout", "put today's session
    on paper", "print full body A" is one session — the exercises with boxes
    to tick. "Print my workouts", "what have I got this week", "print the
    schedule" is what='schedule' instead: the programme, not one session.
    Plural usually means the schedule; singular usually means the session.
    With no name it is today's, or the next one if today is a rest day, and
    she will say which she printed.

    Printing IS the reply. Confirm in one short sentence and do not read the
    items back — the paper is the point, and reciting it defeats the point.

    If a print fails you will get a plain sentence back — no printer, no
    access, no response. Say that sentence and stop. Do not retry, and do not
    offer to read the list out instead unless he asks.

    {user} trains, and his sessions live as files on this machine. When he
    says he is starting, doing, running, pulling up or displaying a workout —
    or names one, like "full body A" — call start_workout. Do it immediately,
    without asking which or confirming first; he is stood in the garage
    waiting to move.

    Never write a note about a workout. A workout is a session on the screen,
    not a document. If save_note looks like the right tool for something to do
    with training, it is not — start_workout or list_workouts is.

    If you cannot find the session he named, say what you do have and let him
    pick. Names get mis-heard, and "full workout A" almost certainly means
    "Full Body A".

    While a session is running, call log_set for anything that sounds like a
    finished set: "bench press one eighty five for five", "that's the dips",
    "rower done". Put whatever he said about weight and reps into the result —
    it is kept against the exercise and it is what makes "what did I lift last
    time" work later.

    Do NOT start rest timers by yourself. When he wants one he will say so —
    "rest", "start the rest", "start the timer", "ninety seconds" — and that
    is when you call start_rest. With no length given it uses the rest written
    into the workout file for whatever he last logged, so you do not need to
    work it out or ask.

    Keep replies to a few words while he is training. He has a bar in his
    hands.

    You can play things from YouTube. Use play_media whenever {user} asks to
    play, put on, pull up, show, or find a video, a song, a clip or a channel.

    Pass what they want to WATCH, not what they said. "Pull up a video on how
    to sharpen a chisel" is the query "how to sharpen a chisel". Do not add
    words they did not say, and do not add the year unless they gave one.

    Set audio_only when the picture does not matter — music, a podcast, a
    radio mix, an album — or when they say "put on" rather than "show me".
    That leaves the dashboard on screen and uses far less of the machine.

    Say what started, in one short sentence, and stop. The title is already
    on the screen and you are talking over the first seconds of it. If they
    say it is the wrong one, call media_control with 'next' — that plays the
    next search result without searching again, so do not search again.

    Use media_control for pause, resume, stop, restart, forward, back,
    louder, quieter and volume. Work out the seconds yourself: "back a
    minute" is 60. Never announce the new volume as a number unless they
    asked what it was.

    Use media_status when they ask what this is, what is playing, or how much
    is left.

    You cannot queue things up, make playlists, or resume something from
    yesterday, and you should say so plainly rather than pretending.

    You can check yourself over. Use run_self_check when {user} asks for a
    diagnostic, a health check, a self test, whether everything is working, or
    whether one particular thing works — the printer, the microphone, the
    internet. Use it for the single-item questions too: the answer for one is
    part of the same check, and a failure somewhere else is worth knowing.

    It takes up to a minute, so say one short sentence first — "Let me check
    myself over." — and then run it. Never run it twice in one conversation
    unless something was fixed in between.

    Reporting it is the part that matters. Lead with the verdict in one
    sentence: everything passed, or how many problems there are. Then name at
    most three, worst first, in the words the check used. Do not read the list
    out; the whole report is on the screen and you should say so.

    If something failed, say what to do about it — each check knows. Give the
    shortest version out loud and leave the exact command to the screen; a
    shell command read aloud helps nobody.

    Set print_it when asked to print the check or for a record of it. Do not
    print it otherwise.

    You cannot fix what you find. Say what is wrong and what would fix it,
    and do not offer to restart services or reinstall anything — you have no
    tool for it, and the watchdog handles the restarts that are safe to make.

    You can run an interval timer for training. Use start_interval_timer for
    anything with rounds, work and rest, or a fixed block of time to move in.
    It is NOT set_reminder — that is for one-off timers and clock times, and a
    workout interval is neither.

    Four shapes, and the words {user} will use for them:

    Rounds. "Forty on, twenty off, eight rounds" is kind=rounds work=40
    rest=20 rounds=8. "Tabata" means work=20 rest=10 rounds=8. "Three rounds
    of a minute" with no rest is work=60 rounds=3.

    EMOM, every minute on the minute. "EMOM for twelve" is kind=emom
    rounds=12. If he says a different interval — "every ninety seconds for ten
    rounds" — pass every=90.

    A repeating mark. "Beep every two minutes for twenty" is kind=beep
    every=120 minutes=20.

    One countdown. "Twenty minute AMRAP", "five minute plank", "a two
    thousand metre row" is kind=countdown minutes=20 with a label — AMRAP,
    Plank, Row — so the screen says what he is doing.

    Work the seconds out yourself. "A minute on, thirty seconds off" is
    work=60 rest=30. Never ask him to confirm the arithmetic.

    He may want a moment before it starts. Two ways, and they are different.

    A longer count-in: "give me thirty seconds first", "start in a minute" is
    lead_in=30 or lead_in=60. Leave lead_in out for the usual short count-in.
    lead_in=0 starts on the word.

    Held, for an open-ended wait: "start it when I say go", "wait for me",
    "on my mark", "set it up but do not start". Pass hold=true. The timer goes
    on the screen and the clock does not move until he says go, however long
    that takes. Release it with interval_control action=go. Do not guess a
    number of seconds for this — an open-ended wait is what hold is for.

    Say one short sentence and stop. She counts him in out loud and the screen
    carries the clock, so a long confirmation is just talking over the count.

    Use interval_control for go, pause, resume, stop, skip, status, add,
    less, show and hide. "Go", "begin", "start" and "I am ready" are action=go — it
    releases a held timer and resumes a paused one.
    "Give me another thirty seconds" is add with seconds=30. "How long left"
    is status. Keep these replies to a few words — he is out of breath.

    If a timer is already running and he asks for another, the new one
    replaces it. Say so in three words.

    The clock is not the timer. "Show me the board", "put the shopping list
    up", "show my workout" all work while a timer is running — the clock
    steps aside, the timer keeps going, and he keeps being counted down out
    loud. Do not stop a timer to show him something, and do not tell him he
    has to. "Hide the timer" and "put the clock away" are interval_control
    action=hide; "show the timer", "where is the clock" are action=show.

    If you do not know something and cannot look it up, say so in one short
    sentence rather than guessing. If a request is ambiguous, ask one
    clarifying question.

    After you answer, the microphone stays open for a few seconds, so {user}
    can follow up without saying the wake word again. Offering a follow-up is
    fine. Do not tell them to say the wake word again — they do not need to.

audio:
  # Device names as they appear in `python -m sounddevice`. Match on NAME,
  # never on index — card numbers shift on USB re-enumeration and an
  # appliance that goes silently deaf after a power blip is the worst kind
  # of broken.
  #
  # BOTH of these must be the ReSpeaker. That is not a typo and it is the
  # single most important line in this file.
  #
  # The XVF3800 does acoustic echo cancellation by comparing what the mics
  # hear against a reference of what is being played. It gets that
  # reference from ITS OWN USB playback endpoint. Play the assistant's
  # voice through the SER8's HDMI or its onboard 3.5 mm jack instead and
  # the chip never sees the reference — AEC degrades to guesswork, the
  # assistant starts triggering on its own voice, and barge-in stops
  # working. Everything good about this microphone depends on closing that
  # loop.
  #
  # Wiring: TTS -> ReSpeaker over USB -> ReSpeaker's 3.5 mm jack -> your
  # powered speaker. (Or its JST connector, which drives a 5 W speaker
  # directly.)
  input_device: "Array"
  output_device: "Array"

  # Recover the microphone over USB, by vendor:product id.
  #
  # A warm reboot does not cut USB bus power, so the array's processor never
  # restarts. It comes back enumerated and bound but with a wedged audio
  # endpoint — arecord returns "Input/output error" and the assistant is
  # silently deaf until somebody physically unplugs it. That is not an
  # acceptable failure mode for a device meant to survive a power cut on its
  # own.
  #
  # At startup the service reads a fraction of a second of audio to see
  # whether the device actually works. Only if that fails does it escalate:
  # first cutting power to the array's hub port with uhubctl (which is
  # genuinely equivalent to unplugging it), then falling back to
  # USBDEVFS_RESET. Measured here, the reset alone does NOT clear the wedge —
  # power has to drop.
  #
  # Requirements, both of which install.sh handles:
  #   * uhubctl installed, and the array plugged into a hub that supports
  #     per-port power switching. Run `uhubctl` to see which of yours do —
  #     the SER8's own rear ports do not, the Sabrent's internal hubs do.
  #   * the udev rules in systemd/99-respeaker.rules, which cover the hub as
  #     well as the microphone.
  #
  # Set to null to disable recovery entirely.
  usb_reset: "2886:001a"
  # How long to hold the port unpowered. Two seconds is usually enough for
  # the XMOS to fully discharge; three is cheap insurance.
  usb_power_off_seconds: 3

  # If no audio frames arrive for this long, the microphone is gone —
  # unplugged, switched off, or wedged — and the service exits so systemd can
  # restart it into the device recovery loop. That makes an unplug, a power
  # switch and a warm-reboot wedge all self-healing.
  #
  # Note this does NOT fire when you press the array's mute button: a muted
  # array still streams silence, which is exactly the distinction we want.
  # Set to 0 to disable.
  stall_timeout_seconds: 15

  sample_rate: 16000
  frame_ms: 80             # 1280 samples at 16 kHz

wake_word:
  # Either a BUNDLED model name, downloaded automatically on first use:
  #     alexa, hey_jarvis, hey_mycroft, hey_rhasspy, ok_nabu, timer, weather
  # or a PATH to a .onnx model you trained yourself, relative to this file:
  #     models/wake/you_there_lance.onnx
  #
  # There is no third option. The wake phrase is a trained neural network,
  # not a string match — you cannot simply type a new phrase here and have
  # it work. Custom phrases mean training a model, which takes about an hour
  # in openWakeWord's automatic_model_training Colab notebook and needs no
  # recordings of your own voice: it synthesises thousands of examples with
  # text to speech.
  #
  # Choosing a phrase, in rough order of importance:
  #   * Three or more syllables. Short phrases false-trigger constantly.
  #   * Uncommon in ordinary speech. This is why "hey Jarvis" works and
  #     "computer" does not — you say the second one by accident.
  #   * Distinct consonants. Phrases that blur into a vowel are harder for
  #     a small model to pin down than ones with hard stops in them.
  model: "hey_jarvis"
  # Detection threshold. START HERE when tuning. Higher = fewer false
  # positives and more missed wakes. Log every trigger for a week and
  # adjust against your own household, not against a benchmark.
  threshold: 0.55
  # Ignore further detections for this long after one fires.
  refractory_seconds: 2.0

  # How many 80 ms frames in a row must clear the threshold before this
  # counts as a wake.
  #
  # This is a better first lever than the threshold, and you should reach for
  # it first. The model already integrates over roughly a second and a half,
  # so when you genuinely say the wake word the score STAYS up for several
  # frames. A dropped pan, a chair on tile, a syllable off the television or
  # a word that happens to rhyme spikes for one frame and falls away.
  #
  # Raising the threshold costs you real wakes from the far side of the room,
  # where the score is honestly lower. Requiring the score to persist costs
  # you almost nothing, because when you mean it, it does persist.
  #
  # 2 is a large improvement over 1. 3 starts to feel sluggish.
  confirm_frames: 2

  # Ignore any detection made on audio that is not speech at all.
  #
  # openWakeWord will run Silero VAD alongside the wake model and zero out
  # predictions from non-speech audio. That removes the entire family of
  # false wakes that come from NOISE rather than from words — which, in a
  # kitchen, is most of them. Costs about a megabyte of model and a
  # negligible amount of CPU. Set to 0 to switch it off.
  vad_threshold: 0.5

  # After the chime, how long to wait for you to actually start talking.
  #
  # Without this a false trigger opens the microphone for the full utterance
  # limit — twenty seconds of the screen saying "listening" with nobody
  # there. That is what turns an occasional spurious wake into something that
  # feels constant. Five seconds is plenty: you say the wake word and then
  # you speak. Set to 0 to wait the full utterance limit as before.
  speech_timeout_seconds: 5

vad:
  # Trailing silence before we decide you have stopped talking. Too low
  # and it cuts you off mid-sentence; too high and the device feels dead.
  silence_ms: 700
  # Hard cap on a single utterance.
  max_utterance_seconds: 20
  # Minimum speech before we bother transcribing — rejects a cough.
  min_speech_ms: 300

stt:
  # faster-whisper model size. base.en is the floor; small.en is
  # noticeably better on accents, proper nouns, and cross-room speech and
  # runs comfortably on the SER8.
  model: "small.en"
  device: "cpu"
  compute_type: "int8"
  beam_size: 1
  language: "en"
  # Whisper confabulates text from silence. Anything below this average
  # log-probability is discarded rather than sent to the model.
  min_logprob: -1.0

tts:
  engine: "piper"
  # Path is resolved by scripts/fetch_models.sh
  voice: "models/piper/en_GB-semaine-medium.onnx"
  # Speaking rate. 1.0 is the model default; lower is slower.
  length_scale: 1.0

behaviour:
  # Play a short tone the instant the wake word fires, before
  # transcription begins. Tells you it heard you.
  ack_chime: true
  # Stop TTS playback when speech is detected during playback.
  barge_in: true
  # Mute the wake-word listener while speaking. Belt and braces on top of
  # the mic array's hardware echo cancellation.
  mute_while_speaking: true
  # After a reply finishes, reopen the microphone for this long so you can
  # ask a follow-up without saying the wake word again. Set 0 to require the
  # wake word every time.
  #
  # Keep this consistent with the system prompt: if it is 0, the assistant
  # should not be offering follow-ups, because you would not be able to give
  # one. See context.system_prompt.
  follow_up_seconds: 8

  # Silence cover for slow replies. A web search adds several seconds during
  # which the model emits nothing, and silence from a voice assistant is
  # indistinguishable from failure — you repeat yourself, which makes it
  # worse. If nothing has been spoken by this point, say something short.
  #
  # The system prompt also asks the model to speak before searching, which is
  # the nicer version of the same fix. This is the backstop for when it
  # doesn't. Set to 0 to disable.
  filler_after_seconds: 2.5
  # Saying any of these ends the conversation immediately: playback stops,
  # any reply still being generated is abandoned, the follow-up window
  # closes, and the device goes back to waiting for the wake word.
  #
  # This is handled entirely in the audio process and never touches the
  # network, so it works instantly, and it works even when the API is slow
  # or down — which is exactly when you most want to be able to shut it up.
  #
  # Matching is exact at the CORE, after lowercasing, stripping punctuation,
  # and trimming padding words off both ends. So "okay Lance, go to sleep now
  # please" matches the entry "go to sleep", and "stop by the store on the way
  # home" still does not match anything, because its core is not a dismissal.
  #
  # That middle ground is deliberate. Substring matching would end the
  # conversation every time you mentioned a shop. Whole-string matching meant
  # it only worked when you happened to say the bare phrase and nothing else,
  # which is not how anyone talks — and a dismissal that works half the time
  # is worse than none, because you keep trying it.
  stop_phrases:
    - "stop"
    - "cancel"
    - "quiet"
    - "never mind"
    - "nevermind"
    - "forget it"
    - "thats all"
    - "that's all"
    - "that is all"
    - "im done"
    - "i'm done"
    - "were done"
    - "we're done"
    - "go to sleep"
    - "go back to sleep"
    - "nothing else"
    - "no thank you"
    - "no thanks"
    - "thank you thats all"
    - "thank you that's all"
    - "stop it"
    - "stop talking"
    - "stop listening"
    - "be quiet"
    - "shut up"
    - "hush"
    - "enough"
    - "thats enough"
    - "that's enough"
    - "that is enough"
    - "thats it"
    - "that's it"
    - "sleep"
    - "go sleep"
    - "back to sleep"
    - "goodnight"
    - "good night"
    - "night night"
    - "all done"
    - "im good"
    - "i'm good"
    - "were good"
    - "we're good"
    - "no more"
    - "leave it"
    - "drop it"
    - "dismissed"
    - "stand down"
    - "thatll be all"
    - "that'll be all"
    - "that will be all"
  # Words with no meaning at the edges of a dismissal. These are trimmed off
  # both ENDS before matching, and only ever to reveal a phrase that is on the
  # list above in full — so this widens what you can say without widening what
  # counts. The assistant's own name is added automatically.
  stop_fillers:
    - "okay"
    - "alright"
    - "yeah"
    - "please"
    - "thanks"
    - "now"
    - "mate"
    - "buddy"
  # Listen for a dismissal WHILE a reply is playing.
  #
  # Without this, the microphone is effectively off for the whole length of a
  # reply: "go to sleep" works in the follow-up window afterwards and does
  # nothing at all mid-sentence. Same words, same room, different result — the
  # thing that reads as unreliable rather than as a missing feature.
  #
  # It listens underneath the assistant's own voice rather than stopping
  # playback to check, and only cuts off when a dismissal has actually been
  # transcribed. Worst case that is about a second of extra talking; in
  # exchange it never cuts you off for a cough, which is the failure people
  # cannot forgive.
  #
  # This depends entirely on the microphone array's hardware echo
  # cancellation. It is correct on the ReSpeaker with the speaker wired
  # through the array; switch it off if you ever move audio to the mini PC's
  # own jack.
  dismiss_while_speaking: true
  # Longest interruption to consider. Dismissals are short; anything longer
  # is you talking to somebody else in the room.
  dismiss_max_seconds: 2.5
  # Play a rising three-tone when a timer or reminder fires. Longer and more
  # insistent than the wake chime, because it has to cut through a running
  # tap and a conversation — but deliberately not an alarm clock.
  reminder_chime: true

  # Saying any of these switches to patient endpointing for exactly ONE
  # utterance, then reverts. Composing a sentence out loud involves much
  # longer pauses than asking a question, and one global setting cannot
  # serve both without making the other feel broken.
  dictation_phrases:
    - "take this down"
    - "take a letter"
    - "take dictation"
    - "write this down"
    - "let me dictate"
    - "dictation"
  # Trailing silence allowed while dictating, and the hard cap.
  dictation_silence_ms: 1800
  dictation_max_seconds: 120

  # Repeat the last reply. Answered entirely in the audio process — no API
  # call, no latency, no cost, and it still works with the network down.
  repeat_phrases:
    - "say that again"
    - "repeat that"
    - "repeat"
    - "what did you say"
    - "come again"
    - "one more time"
  # Same, but slower — for phone numbers, addresses, and anything you are
  # writing down while it talks.
  repeat_slow_phrases:
    - "say that again slowly"
    - "repeat that slowly"
    - "slower"
    - "say it slower"
    - "more slowly"
  slow_length_scale: 1.4

  # Play a short falling two-tone when dismissed. Rising means awake, falling
  # means asleep — the direction carries the meaning without explanation.
  stop_chime: true

  # Rotated in order, never random — hearing the same three words every time
  # is worse than the pause it covers.
  filler_phrases:
    - "Let me look that up."
    - "One moment."
    - "Checking now."
    - "Give me a second."

media:
  # Play things from YouTube, out loud or on the screen.
  #
  # No browser. mpv plus yt-dlp gives you the video with no ads, no cookie
  # wall and no consent banner, starting at the first frame — and an IPC
  # socket, which is what turns "pause", "back thirty seconds" and "turn it
  # down" into things you can say instead of things you have to click.
  #
  #   sudo apt install -y mpv yt-dlp
  #   python3 scripts/media_probe.py
  #
  # Nothing is downloaded. Everything is streamed and nothing is written to
  # disk except the control socket below.
  enabled: true

  # THE SETTING PEOPLE GET WRONG. mpv must play through the microphone array,
  # exactly like the assistant's own voice does.
  #
  # The XVF3800 cancels echo by comparing what the mics hear against a
  # reference of what IT is playing. Send video audio anywhere else — HDMI,
  # the mini PC's own jack — and the chip never sees it, so the wake word
  # stops working the moment anything is playing. Which is precisely when you
  # want to say "pause".
  #
  # 'auto' follows the system default, which is NOT the array. Run
  #   python3 scripts/media_probe.py --devices
  # and paste the array's name in here.
  audio_device: "pipewire/alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_114993701262100395-00.analog-stereo"

  # Starting volume, 0-100, and how far "louder" and "quieter" move it.
  volume: 85
  volume_step: 15
  # What the volume drops to while the assistant is listening or talking.
  # It stays ducked for the WHOLE exchange, including follow-ups, and comes
  # back up when the conversation ends — lifting it between sentences means
  # the video jumps to full while you are still mid-question.
  duck_volume: 25
  # Safety net. If a duck is never lifted — a dropped message, a crash
  # mid-reply — restore the volume anyway after this long. Without it, one
  # lost message leaves everything you play afterwards at a murmur and
  # nothing in the log says why.
  duck_timeout_seconds: 180

  # How far "skip forward" and "go back" move when no length is given.
  seek_seconds: 30
  # Cap the resolution. 1080p decodes comfortably on the SER8; asking for
  # 4K on a 1080p screen costs CPU and buys nothing.
  max_height: 1080

  # How many search results to keep, so "not that one" can move down the list
  # without searching again. Five is plenty — past the third result you are
  # better off rewording the request.
  results: 5
  search_timeout_seconds: 20

  # Where mpv listens for commands. Anywhere writable; the data directory
  # keeps it alongside the database rather than in /tmp, where a cleaner or
  # a reboot can take it.
  ipc_socket: "data/mpv.sock"
  # X display for fullscreen video. Same one the dashboard is on.
  display: ":0"

  mpv_bin: "mpv"
  ytdlp_bin: "/home/lance/assistant/.venv/bin/yt-dlp"

selfcheck:
  # Check everything, once a day, and say nothing unless something is wrong.
  #
  # The failure this exists for is not a crash. It is the Tuesday you say
  # "print the shopping list" and nothing happens, because the printer has
  # been unplugged since Saturday. Nothing was broken in a way anybody could
  # see — there was just no reason to look.
  #
  # Ask any time: "run a self check", "is everything working", "test yourself".
  #   curl -s localhost:8760/selfcheck | jq          # the last report
  #   curl -s 'localhost:8760/selfcheck?run=1' | jq  # a fresh one
  # Press d on the appliance's own keyboard to put the last one on screen.
  enabled: true

  # --- the daily run ---
  daily: true
  # Local hour, 24-clock. The check runs the first time the clock passes this
  # after a fresh day begins, so a machine that was off all morning still gets
  # checked when it comes back rather than skipping the day.
  daily_hour: 7

  # Speak up when everything is FINE as well as when it is not.
  #
  # Leave this false. A daily report that says "all thirty checks passed" is a
  # report you stop hearing within a week — and the one that matters goes past
  # you along with it. Silence is the signal.
  announce_when_healthy: false

  # Print the daily result. Only when something is wrong, unless
  # print_everything is true.
  #
  # Worth knowing why this is on: the slip existing at all is proof the printer
  # works. Every other check in the report is an assertion about hardware; this
  # one is the hardware agreeing.
  print_daily: false
  print_everything: false

  # --- the checks that cost something ---
  # One call to the cheapest model, about $0.0001. It is the ONLY thing that
  # proves the API key is valid — reaching the host only proves the network.
  test_api: true
  # A real web search, about a cent. Proves the search tool itself works,
  # rather than just that the API answers.
  test_web_search: true
  # A real YouTube search. Free, takes two seconds, and this is the thing that
  # rots silently: yt-dlp breaks whenever YouTube changes.
  test_youtube: true

  # --- thresholds ---
  disk_warn_gb: 5
  disk_fail_gb: 1
  # Warn if the last 24 hours cost more than this. Not a kill switch — the
  # provider console cap is the real backstop.
  spend_warn_usd: 3.0
  # Warn if this percentage of wake-word triggers had nothing said after them.
  false_wake_warn_pct: 50
  # Warn about a case or workout left open longer than this. An open session
  # routes every request to the bigger model, and it is invisible.
  stale_case_hours: 18
  # No single check may take longer than this before it is abandoned and
  # reported as a failure. A diagnostic that hangs has become the outage.
  check_timeout_seconds: 12

status:
  # The status wall: the same twenty-six probes as the daily self check,
  # run continuously instead of once a day.
  #
  #   http://192.168.0.44:8760/status    on anything with a browser
  #   the strip along the bottom of the appliance's own screen
  #
  # Reading the page costs nothing. The probes run on the orchestrator's own
  # one-second tick and the page reads the cache, so leaving it open on a
  # spare monitor all day adds no work at all.
  enabled: true

  # How stale each kind of reading is allowed to get, in seconds. This is the
  # whole design: "ping everything constantly" is not something you can do to
  # this box.
  #
  #   fast    process memory and SQLite. Free. Near-live.
  #   medium  a stat, a socket, a subprocess.
  #   slow    touches hardware or loads a model — the PRINTER is here, over
  #           USB, and hammering it while a receipt is going through is how
  #           you wedge it. Leave this one alone.
  #   deep    a real network call that costs money: the model API, web
  #           search, YouTube. Four times a day is plenty.
  every:
    fast: 5
    medium: 60
    slow: 900
    deep: 21600

  # Probes started per tick. The tick is one second; without a cap, a whole
  # tier coming due together would put twenty probes on threads at once and
  # the printer would be one of them.
  per_tick: 2

  # A FAILING probe is re-read this often regardless of its tier — it is the
  # one you are stood in front of the screen waiting to go green, and waiting
  # fifteen minutes to find out you fixed it is the wrong experience.
  retry_failed_seconds: 15

intervals:
  # An interval timer you can drive with your hands full.
  #
  #   "forty seconds on, twenty off, eight rounds"
  #   "EMOM for twelve minutes"
  #   "beep every ninety seconds for twenty minutes"
  #   "twenty minute AMRAP"
  #
  # She calls the changes, the round numbers and the last few seconds, so you
  # are not squinting at a phone on the floor between burpees. The screen goes
  # to a full-bleed clock: green to move, amber to breathe, red for the last
  # five seconds.
  #
  # Say "pause", "carry on", "skip", "add thirty seconds", "how long left",
  # "stop the timer".
  enabled: true

  # Counted in before the first work interval, so you are not caught standing
  # still. Set to 0 to start immediately.
  lead_in_seconds: 5

  # Speak the last few seconds of each phase — "three, two, one" — so you can
  # time the last rep rather than being surprised by the change.
  count_last_seconds: 3
  # ...but not on a phase barely longer than the count itself. Being counted
  # down from three on a five-second rest is noise, not information.
  count_min_phase_seconds: 8

  # A tone on every change as well as the words. Different tones for work and
  # rest: you learn them in one session and stop needing the words.
  chime: true
  # Say "round three of eight" at the start of each work interval. It goes
  # with the work, not the rest — it is the thing you are about to do.
  announce_rounds: true

  finish_phrase: "Time. Well done."

storage:
  db_path: "data/assistant.db"
  vault_path: "data/vault"

logging:
  level: "INFO"
  # Log every wake-word trigger with its confidence score. Leave this on
  # for the first week — it is the only way to tune the threshold
  # honestly.
  log_wake_events: true
