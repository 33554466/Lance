# ============================================================
# Home AI Appliance — configuration
# Everything you are likely to tune lives here.
# ============================================================

identity:
  # What the assistant calls itself. Used in the system prompt.
  name: "Lance"
  # The user's name, so it can address you.
  user: "Brendan"

server:
  host: "127.0.0.1"
  port: 8760

provider:
  # Which backend to use. Only "anthropic" is implemented in this
  # scaffold; the adapter layer in core/provider.py is where you would
  # add "openai" or "google" without touching anything else.
  name: "anthropic"

  models:
    small: "claude-haiku-4-5"     # timers, conversions, quick lookups
    mid:   "claude-sonnet-5"      # the workhorse — default
    top:   "claude-opus-5"        # long documents, careful reasoning

  # Hard ceiling per reply. Spoken answers should be short; this is a
  # backstop against a runaway generation, not a style control.
  max_tokens: 1024

  # Anthropic prompt caching. Caches the system prompt + tool schemas,
  # which are identical on every request and are most of your input
  # tokens. Cuts input cost by roughly 90% on the cached portion.
  prompt_caching: true

tools:
  web_search:
    # Anthropic runs the search server-side and hands the model the results.
    # You write no integration and maintain no API key for it.
    enabled: true
    # Searches per reply. Three is enough for "what's the weather and will it
    # rain tomorrow"; more mostly buys latency.
    max_uses: 2
    # Which model tiers carry the tool. NOT the small tier: server tools need
    # a recent model, and a tier that cannot search would fail rather than
    # answer. The router pushes anything that smells like a live-information
    # question up to mid for exactly this reason.
    tiers: ["mid", "top"]
    # Optional. Use one or the other, never both.
    # blocked_domains: ["pinterest.com"]
    # allowed_domains: []

reminders:
  # Timers and reminders — the only thing here that speaks without being
  # spoken to first. Stored in SQLite with absolute timestamps, so a restart,
  # an update, or a crash costs you nothing: pending items reload and fire.
  #
  # The MODEL does the date arithmetic. It is told the current time in every
  # request, so "in twenty minutes" and "tomorrow at seven" resolve upstream.
  # That keeps daylight-saving bugs out of the appliance entirely.
  #
  #   curl -s localhost:8760/reminders | jq
  enabled: true
  max_pending: 50

desktop:
  # Window management, as a fixed vocabulary of verbs — never a shell.
  #
  # Every input here arrives through a wake word that occasionally misfires
  # and a transcriber that occasionally mishears. `xdotool type` can drive
  # any application including a terminal, so there is deliberately no tool
  # for typing, clicking, closing windows, or running commands. What is here
  # is what can be undone by saying the opposite.
  #
  # X11 only. Wayland stops one application moving another's windows on
  # purpose; the tools say so rather than failing obscurely.
  #   sudo apt install -y wmctrl xdotool
  enabled: true
  # Windows the assistant will refuse to minimise — its own display, so that
  # "minimise everything" cannot blank the screen you watch it on.
  protect: ["assistant", "lance"]
  # ALSA card for volume. The assistant plays through the array, so the
  # system default sink is the wrong device.
  volume_card: "Array"
  display: ":0"

lists:
  # Named lists. Add, remove, read, clear, and ask what is on all of them.
  #   curl -s localhost:8760/lists | jq
  #   curl -s localhost:8760/lists/work | jq
  enabled: true
  # Used when no list is named. "Add milk" should not need qualifying.
  default: "shopping"
  # Add a new list by adding it here. `say` is how the assistant refers to it
  # out loud; `aliases` are the other things a person might actually SAY for
  # it. Speech does not arrive with a dropdown attached — "put it on the
  # honey-do list" and "add it to the house list" have to reach the same
  # place, and the only way that happens is if you write both down.
  #
  # Getting this wrong fails SILENTLY: the item lands on a list nobody reads,
  # which is the same as losing it. So be generous with aliases.
  known:
    shopping:
      say: "shopping list"
      aliases: ["groceries", "grocery", "store", "supermarket", "food"]
    work:
      say: "work board"
      aliases: ["office", "job", "work todo", "work to do", "day job"]
    projects:
      say: "projects board"
      aliases: ["project", "builds", "build", "workshop", "garage"]
    personal:
      say: "personal board"
      aliases: ["health", "money", "my own", "own list", "admin"]
    army:
      say: "army board"
      aliases: ["military", "guard", "unit", "drill", "training", "readiness"]
    house:
      say: "house board"
      aliases: ["home", "honey do", "honey-do", "chores", "around the house",
                "household", "yard", "garden"]
    kids:
      say: "kids board"
      aliases: ["children", "kid", "school", "family"]
  # Allow creating a list that is not named above, when one is clearly asked
  # for — "start a packing list". Set false to restrict to the list above.
  allow_new: true

memory:
  # Durable facts, remembered across restarts and across months.
  #
  # These are injected into EVERY request, which is what makes them work and
  # also what makes them expensive if abused: a wrong fact costs you on every
  # exchange until removed. The system prompt tells the model to be strict
  # about what earns a place here.
  #
  # Inspect or edit them directly whenever you like — it is just SQLite:
  #   sqlite3 ~/assistant/data/assistant.db "SELECT id,category,text FROM memories;"
  #   sqlite3 ~/assistant/data/assistant.db "DELETE FROM memories WHERE id=7;"
  # or over HTTP:  curl -s localhost:8760/memories | jq
  enabled: true
  # Refuse to store more than this. Roughly 200 short facts is a few thousand
  # tokens on every request — noticeable but not painful. Past that you want
  # retrieval, not injection.
  max_facts: 200

  # Memories age. A fact that WAS true is the dangerous kind: it embeds
  # perfectly, retrieves at the top, and gets stated with total confidence
  # long after it stopped being so. Nothing in a conversation ever says
  # "by the way, that is out of date now", so nothing event-driven can catch
  # it. This is the clock that does.
  sweep:
    enabled: true

    # Once a day is plenty. The check itself is two SQL queries over a few
    # dozen rows — no model call, no network — so the cost is not the reason
    # for the interval; nagging is.
    every_hours: 24

    # Belief below this gets flagged. ONE number, used by both the sweep and
    # the prompt block: two subsystems with two definitions of "stale" will
    # contradict each other in front of you. 0.35 is about a
    # half-life-and-a-half, which is late enough to mean something.
    fresh_floor: 0.35

  # Freeze the clock to demonstrate decay without waiting for it. An ISO date
  # here makes every ageing calculation pretend it is that day. Leave empty
  # for normal running — this is a debugging switch, not a setting.
  clock_at: ""

  # Semantic recall. The keyword search is kept — this runs alongside it.
  #
  # Keyword finds "INC-4412" and surnames. Meaning finds "the roof" in a
  # sentence about shingles. Neither replaces the other, so both vote and the
  # rankings are merged.
  semantic:
    enabled: true

    # 69 MB, 384 dimensions, runs on ONNX Runtime — already a dependency here
    # for the wake word. Changing this model invalidates every stored vector
    # and triggers an automatic re-index; that is handled, but it costs an
    # hour of background work, so do not change it casually.
    model: "BAAI/bge-small-en-v1.5"
    cache_dir: "~/assistant/models/embed"

    # Capped so embedding never competes with transcription. Whisper wants the
    # cores while someone is mid-sentence; an embedding that takes 40 ms
    # instead of 25 ms is invisible, a stuttering transcription is not.
    threads: 2

    # Background indexing. Small batches with a gap, then a long sleep once
    # there is nothing left to do.
    backfill_batch: 32
    backfill_gap_seconds: 2.0
    backfill_idle_seconds: 300.0

documents:
  # Plain text notes, written by the assistant on request. The Linux
  # equivalent of "save this in Notepad".
  enabled: true
  # Everything is confined to this one directory, checked on every write
  # after symlinks are resolved. Filenames are generated from a slugified
  # title, never taken from the model, so a title cannot contain a path.
  path: "~/Documents/Assistant"
  # txt opens in Text Editor with no ceremony. Use md if you would rather
  # have headings and lists render somewhere later.
  format: "txt"
  # Refuse anything longer. A runaway generation should not fill the disk.
  max_chars: 20000

casework:
  # Investigations with a clock on them. Say "I'm starting a phishing email
  # investigation" and Lance opens a case: the SLA starts, the checklist goes
  # on the monitor, and he tracks both columns until you close it.
  enabled: true

  # One YAML file per kind of case. Re-read every time a case opens, so you
  # can fix a step in a text editor and the next case has it — no restart.
  playbook_dir: "~/assistant/playbooks"

  sla:
    # Minutes from the moment you say you are starting.
    #
    # THESE NUMBERS ARE PLACEHOLDERS. They are what a mid-sized shop tends to
    # run, not what YOUR shop runs. Put your real ones here — this is the one
    # setting in this block that is wrong until you change it.
    default: 240
    tiers:
      critical: 60
      high: 120
      standard: 240
      low: 480

    # Speak up at these fractions of the window...
    warn_at: [0.5, 0.75]
    # ...and always this many minutes out, whatever the tier. Fractions alone
    # are wrong for a short SLA: 90% of an hour is six minutes of notice.
    warn_final_minutes: 15

printer:
  # MUNBYN ITPP047. It reports itself as a Seiko Epson TM-m30-II, which is
  # whose ESC/POS dialect it speaks.
  enabled: true

  # Measured on the device by printer_probe, not guessed. The IN endpoint is
  # 0x81 here; the usual guess is 0x82 and it would have failed as a silent
  # thirty-second timeout.
  vendor_id: "0x04b8"
  product_id: "0x0e20"
  out_ep: "0x01"
  in_ep: "0x81"

  # Characters per line at the default font. 42 is right for 80 mm paper.
  # If lists wrap in odd places, this is the number to change — set it to
  # whatever the printer's own self-test page reports.
  width: 42

  cut: true
  feed_lines: 3

  # Printed above the title, the way a shop name sits on a till receipt.
  # Set to "" for no masthead.
  header: "LANCE"

  # Give up rather than hang. A printer that is off, jammed, or out of paper
  # must not hold a worker thread while someone is waiting to be answered.
  timeout_ms: 5000



workouts:
  # Training sessions, run through the same checklist machinery as casework.
  #
  # A session is a FILE, not a playbook: drop a text file in the folder below
  # and say "start today's workout". With no name it takes the newest file,
  # which is also the answer to getting a workout in here without dictating it.
  #
  #     # Push Day A
  #     ## Main
  #     Bench press, 5 x 5 @ 185 | rest 180
  #     Dips, 3 x AMRAP
  #
  # "# " is the title, "## " a section, everything else an exercise. The
  # "| rest 180" tail is optional and falls back to the default below.
  enabled: true
  path: "~/assistant/workouts"

  # Used when a line does not specify its own rest.
  default_rest_seconds: 90

  # Logging a set starts the rest countdown automatically, so you never have
  # to say a second sentence with a bar in your hands. Set false if you would
  # rather ask for timers yourself.
  announce_rest: true


location:
  # Passed to the search tool so "near me", "tonight" and local business
  # hours resolve correctly. It is a hint for the search engine, not
  # tracking, and it never leaves the request. Set this to where the
  # appliance actually lives.
  city: ""
  region: "Arizona"
  country: "US"
  timezone: "America/Phoenix"

router:
  # Requests shorter than this many characters with no complexity
  # markers go to the small tier.
  small_max_chars: 80
  # Saying any of these out loud forces the top tier.
  escalate_phrases:
    - "think hard"
    - "think carefully"
    - "take your time"
  # Questions that need looking up. These are usually SHORT, so without this
  # list they would fall through to the small tier — which does not carry the
  # search tool. Matching any of these forces the mid tier.
  live_info_markers:
    - "weather"
    - "forecast"
    - "temperature"
    - "rain"
    - "snow"
    - "news"
    - "headline"
    - "today"
    - "tonight"
    - "tomorrow"
    - "this week"
    - "right now"
    - "currently"
    - "latest"
    - "recent"
    - "current"
    - "price"
    - "cost of"
    - "stock"
    - "score"
    - "who won"
    - "open now"
    - "still open"
    - "hours"
    - "near me"
    - "traffic"
    - "look up"
    - "search"
  # Words that push a short request up to the mid tier anyway.
  complexity_markers:
    - "why"
    - "explain"
    - "compare"
    - "draft"
    - "write"
    - "summarize"
    - "summarise"
    - "analyze"
    - "analyse"

context:
  # How many prior turns (user+assistant pairs) to send. Capping this is
  # what stops your input cost growing without bound over a long day.
  history_turns: 8
  # A gap longer than this starts a fresh conversation rather than continuing
  # the old one. Without it, coming back after three days makes the assistant
  # reply to something you said on Tuesday as though you had just said it.
  session_gap_minutes: 90
  # Characters of system prompt + persona. Kept small deliberately.
  system_prompt: |
    You are {name}, a voice assistant running on a dedicated appliance in
    {user}'s home. You are speaking out loud, so your replies are read by a
    text-to-speech engine.

    Keep answers short. Two or three sentences is usually right. If the
    answer is genuinely long, give the headline first and offer to go on.

    Never use markdown, bullet points, asterisks, or emoji — they are read
    aloud as noise. Write numbers and units the way a person would say
    them. Spell out anything that would be mangled if read literally.

    You are located in {place}. When {user} says "here", "nearby", or
    "tonight", that is what they mean.

    You can search the web, and you should whenever a question depends on
    current information — weather, news, prices, opening hours, sports,
    anything that changed after your training.

    When you are about to search, say one short sentence first — "Let me
    check." or "One second." — and then search. This matters more than it
    looks: a search takes several seconds, and everything you say is being
    read out loud, so that sentence is the only thing standing between {user}
    and silence. Say it before the search, never after.

    Never read a web address out loud, and do not say "according to" followed
    by a site name. The screen shows sources; your job is the answer. Give the
    figure or the fact, and say how fresh it is only when that matters — "as
    of this morning" for a price, nothing at all for a forecast.

    You can set timers and reminders. Work out the absolute time yourself
    from the timestamp in the message — "in twenty minutes", "at six", "next
    Tuesday morning" — and pass it as ISO 8601 local time. Use kind 'timer'
    for short countdowns and 'reminder' for anything tied to a clock time.
    Confirm briefly: "Set, in twenty minutes." Never read the timestamp back.

    You keep a shopping list and five task boards for {user}: house,
    projects, kids, work, personal, and army. Add items as they are
    mentioned, several at once when several are named.

    Choose from what was said. "We need milk" is shopping; "email the
    contractor" is work; "the gutters need clearing" is house; "finish the
    garage shelf" is projects; "book my physical" is personal; "drill
    weekend paperwork" is army. If it is genuinely ambiguous, ask which one —
    one short question — rather than guessing. An item filed on the wrong
    board is not wrong, it is lost, because nobody will ever look there.

    When {user} says they have done, finished, or handled something, tick it
    off with list_complete rather than removing it. Completed items stay
    visible on the board, which is how they can see what they got through.

    There are no due dates or priorities. If timing matters {user} puts it in
    the wording of the item itself, so keep their phrasing intact.

    When reading a list back, say it as a person would — "milk, eggs, bread
    and coffee" — never as a numbered list, and never read the list name back
    to them when they just told you what it was.

    You can arrange windows on the screen: list them, focus one, maximise,
    restore, fullscreen, minimise, snap to the left or right half, centre, and
    switch workspace. If it is unclear which window is meant, list them and
    ask rather than guessing.

    You cannot close windows, type, click, or run commands, and you should
    say so plainly if asked — those are not missing by accident.

    You can save notes and documents to {user}'s notes folder, and read them
    back. Use save_note whenever they ask you to write something down, take
    a note, draft something, or make a list — do it without asking permission
    first, since asking wastes a turn on something they already requested.

    What you WRITE and what you SAY are different. The note is read on a
    screen, so give it line breaks, headings and structure. Your spoken reply
    is just the confirmation: say what you called it and roughly how long it
    is, in one sentence. Never read a saved note back aloud unless asked.

    You remember things across conversations. Anything under "What you know
    about this household" was learned earlier and is still true unless {user}
    says otherwise.

    Use remember when {user} asks you to, and when they mention a stable fact
    about themselves, their household, or how they like things done. Write it
    as one self-contained sentence that will still make sense read cold in a
    year. Say that you have noted it, briefly, and move on — do not read the
    fact back verbatim.

    Be strict about what you store. Remembered facts go into every future
    conversation, so a wrong one is wrong forever, and a useless one costs
    something on every exchange. Do not store one-off task details, anything
    that will be untrue next week, passing moods, or anything sensitive like
    passwords, card numbers or medical specifics unless directly asked to.

    If {user} corrects something you remembered, forget the old fact and
    remember the new one. Do not leave both.

    Use recall to search past conversations when they refer to something from
    before that is not in what you already know.

    {user} runs investigations at work. When he says he is starting one —
    "I am starting a phishing email investigation" — call start_case
    immediately. Do not ask which playbook, how urgent it is, or for a ticket
    number first. The clock started when he said it started, and every
    question you ask before opening the case is time off it. If he gave a
    reference or a severity, pass them; if not, leave them out.

    While a case is open, keep replies to one sentence. He is reading a
    screen and working, not having a conversation.

    When he says he did something, tick it off with check_step using his own
    words — matching handles the wording, so do not translate it. If he also
    said what he FOUND, pass it as the finding: "the domain was registered
    four days ago" belongs on that step, and it is what turns the write-up at
    the end into transcription instead of recall.

    Never tick off a step he did not say he did. An unticked step costs him
    ten seconds. A wrongly ticked one reads afterwards as work that was done,
    and that is how a thing gets missed.

    If it is unclear which step he means, ask one short question naming the
    two candidates rather than guessing.

    You can print on paper. Use print_list when {user} wants a list to take
    with him, and print_case for the investigation.

    Printing IS the reply. Confirm in one short sentence and do not read the
    items back — the paper is the point, and reciting it defeats the point.

    For the case, pick `only` from what was asked. "What have I still got to
    do" is open. "Print my findings", or anything about writing the report, is
    findings. A handover or a full write-up is all. The full record runs to
    about a foot of paper, so do not print it when the short one was wanted.

    If a print fails you will get a plain sentence back — no printer, no
    access, no response. Say that sentence and stop. Do not retry, and do not
    offer to read the list out instead unless he asks.

    If you do not know something and cannot look it up, say so in one short
    sentence rather than guessing. If a request is ambiguous, ask one
    clarifying question.

    After you answer, the microphone stays open for a few seconds, so {user}
    can follow up without saying the wake word again. Offering a follow-up is
    fine. Do not tell them to say the wake word again — they do not need to.

audio:
  # Device names as they appear in `python -m sounddevice`. Match on NAME,
  # never on index — card numbers shift on USB re-enumeration and an
  # appliance that goes silently deaf after a power blip is the worst kind
  # of broken.
  #
  # BOTH of these must be the ReSpeaker. That is not a typo and it is the
  # single most important line in this file.
  #
  # The XVF3800 does acoustic echo cancellation by comparing what the mics
  # hear against a reference of what is being played. It gets that
  # reference from ITS OWN USB playback endpoint. Play the assistant's
  # voice through the SER8's HDMI or its onboard 3.5 mm jack instead and
  # the chip never sees the reference — AEC degrades to guesswork, the
  # assistant starts triggering on its own voice, and barge-in stops
  # working. Everything good about this microphone depends on closing that
  # loop.
  #
  # Wiring: TTS -> ReSpeaker over USB -> ReSpeaker's 3.5 mm jack -> your
  # powered speaker. (Or its JST connector, which drives a 5 W speaker
  # directly.)
  input_device: "Array"
  output_device: "Array"

  # Recover the microphone over USB, by vendor:product id.
  #
  # A warm reboot does not cut USB bus power, so the array's processor never
  # restarts. It comes back enumerated and bound but with a wedged audio
  # endpoint — arecord returns "Input/output error" and the assistant is
  # silently deaf until somebody physically unplugs it. That is not an
  # acceptable failure mode for a device meant to survive a power cut on its
  # own.
  #
  # At startup the service reads a fraction of a second of audio to see
  # whether the device actually works. Only if that fails does it escalate:
  # first cutting power to the array's hub port with uhubctl (which is
  # genuinely equivalent to unplugging it), then falling back to
  # USBDEVFS_RESET. Measured here, the reset alone does NOT clear the wedge —
  # power has to drop.
  #
  # Requirements, both of which install.sh handles:
  #   * uhubctl installed, and the array plugged into a hub that supports
  #     per-port power switching. Run `uhubctl` to see which of yours do —
  #     the SER8's own rear ports do not, the Sabrent's internal hubs do.
  #   * the udev rules in systemd/99-respeaker.rules, which cover the hub as
  #     well as the microphone.
  #
  # Set to null to disable recovery entirely.
  usb_reset: "2886:001a"
  # How long to hold the port unpowered. Two seconds is usually enough for
  # the XMOS to fully discharge; three is cheap insurance.
  usb_power_off_seconds: 3

  # If no audio frames arrive for this long, the microphone is gone —
  # unplugged, switched off, or wedged — and the service exits so systemd can
  # restart it into the device recovery loop. That makes an unplug, a power
  # switch and a warm-reboot wedge all self-healing.
  #
  # Note this does NOT fire when you press the array's mute button: a muted
  # array still streams silence, which is exactly the distinction we want.
  # Set to 0 to disable.
  stall_timeout_seconds: 15

  sample_rate: 16000
  frame_ms: 80             # 1280 samples at 16 kHz

wake_word:
  # Either a BUNDLED model name, downloaded automatically on first use:
  #     alexa, hey_jarvis, hey_mycroft, hey_rhasspy, ok_nabu, timer, weather
  # or a PATH to a .onnx model you trained yourself, relative to this file:
  #     models/wake/you_there_lance.onnx
  #
  # There is no third option. The wake phrase is a trained neural network,
  # not a string match — you cannot simply type a new phrase here and have
  # it work. Custom phrases mean training a model, which takes about an hour
  # in openWakeWord's automatic_model_training Colab notebook and needs no
  # recordings of your own voice: it synthesises thousands of examples with
  # text to speech.
  #
  # Choosing a phrase, in rough order of importance:
  #   * Three or more syllables. Short phrases false-trigger constantly.
  #   * Uncommon in ordinary speech. This is why "hey Jarvis" works and
  #     "computer" does not — you say the second one by accident.
  #   * Distinct consonants. Phrases that blur into a vowel are harder for
  #     a small model to pin down than ones with hard stops in them.
  model: "hey_jarvis"
  # Detection threshold. START HERE when tuning. Higher = fewer false
  # positives and more missed wakes. Log every trigger for a week and
  # adjust against your own household, not against a benchmark.
  threshold: 0.55
  # Ignore further detections for this long after one fires.
  refractory_seconds: 2.0

vad:
  # Trailing silence before we decide you have stopped talking. Too low
  # and it cuts you off mid-sentence; too high and the device feels dead.
  silence_ms: 700
  # Hard cap on a single utterance.
  max_utterance_seconds: 20
  # Minimum speech before we bother transcribing — rejects a cough.
  min_speech_ms: 300

stt:
  # faster-whisper model size. base.en is the floor; small.en is
  # noticeably better on accents, proper nouns, and cross-room speech and
  # runs comfortably on the SER8.
  model: "small.en"
  device: "cpu"
  compute_type: "int8"
  beam_size: 1
  language: "en"
  # Whisper confabulates text from silence. Anything below this average
  # log-probability is discarded rather than sent to the model.
  min_logprob: -1.0

tts:
  engine: "piper"
  # Path is resolved by scripts/fetch_models.sh
  voice: "models/piper/en_GB-semaine-medium.onnx"
  # Speaking rate. 1.0 is the model default; lower is slower.
  length_scale: 1.0

behaviour:
  # Play a short tone the instant the wake word fires, before
  # transcription begins. Tells you it heard you.
  ack_chime: true
  # Stop TTS playback when speech is detected during playback.
  barge_in: true
  # Mute the wake-word listener while speaking. Belt and braces on top of
  # the mic array's hardware echo cancellation.
  mute_while_speaking: true
  # After a reply finishes, reopen the microphone for this long so you can
  # ask a follow-up without saying the wake word again. Set 0 to require the
  # wake word every time.
  #
  # Keep this consistent with the system prompt: if it is 0, the assistant
  # should not be offering follow-ups, because you would not be able to give
  # one. See context.system_prompt.
  follow_up_seconds: 8

  # Silence cover for slow replies. A web search adds several seconds during
  # which the model emits nothing, and silence from a voice assistant is
  # indistinguishable from failure — you repeat yourself, which makes it
  # worse. If nothing has been spoken by this point, say something short.
  #
  # The system prompt also asks the model to speak before searching, which is
  # the nicer version of the same fix. This is the backstop for when it
  # doesn't. Set to 0 to disable.
  filler_after_seconds: 2.5
  # Saying any of these ends the conversation immediately: playback stops,
  # any reply still being generated is abandoned, the follow-up window
  # closes, and the device goes back to waiting for the wake word.
  #
  # This is handled entirely in the audio process and never touches the
  # network, so it works instantly, and it works even when the API is slow
  # or down — which is exactly when you most want to be able to shut it up.
  #
  # Matching is EXACT after lowercasing and stripping punctuation. That is
  # deliberate: substring matching would end the conversation when you said
  # "stop by the store on the way home". If you want a phrase to work, put
  # the whole phrase here.
  stop_phrases:
    - "stop"
    - "cancel"
    - "quiet"
    - "never mind"
    - "nevermind"
    - "forget it"
    - "thats all"
    - "that's all"
    - "that is all"
    - "im done"
    - "i'm done"
    - "were done"
    - "we're done"
    - "go to sleep"
    - "go back to sleep"
    - "nothing else"
    - "no thank you"
    - "no thanks"
    - "thank you thats all"
    - "thank you that's all"
  # Play a rising three-tone when a timer or reminder fires. Longer and more
  # insistent than the wake chime, because it has to cut through a running
  # tap and a conversation — but deliberately not an alarm clock.
  reminder_chime: true

  # Saying any of these switches to patient endpointing for exactly ONE
  # utterance, then reverts. Composing a sentence out loud involves much
  # longer pauses than asking a question, and one global setting cannot
  # serve both without making the other feel broken.
  dictation_phrases:
    - "take this down"
    - "take a letter"
    - "take dictation"
    - "write this down"
    - "let me dictate"
    - "dictation"
  # Trailing silence allowed while dictating, and the hard cap.
  dictation_silence_ms: 1800
  dictation_max_seconds: 120

  # Repeat the last reply. Answered entirely in the audio process — no API
  # call, no latency, no cost, and it still works with the network down.
  repeat_phrases:
    - "say that again"
    - "repeat that"
    - "repeat"
    - "what did you say"
    - "come again"
    - "one more time"
  # Same, but slower — for phone numbers, addresses, and anything you are
  # writing down while it talks.
  repeat_slow_phrases:
    - "say that again slowly"
    - "repeat that slowly"
    - "slower"
    - "say it slower"
    - "more slowly"
  slow_length_scale: 1.4

  # Play a short falling two-tone when dismissed. Rising means awake, falling
  # means asleep — the direction carries the meaning without explanation.
  stop_chime: true

  # Rotated in order, never random — hearing the same three words every time
  # is worse than the pause it covers.
  filler_phrases:
    - "Let me look that up."
    - "One moment."
    - "Checking now."
    - "Give me a second."

storage:
  db_path: "data/assistant.db"
  vault_path: "data/vault"

logging:
  level: "INFO"
  # Log every wake-word trigger with its confidence score. Leave this on
  # for the first week — it is the only way to tune the threshold
  # honestly.
  log_wake_events: true
